<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教育データ情報法データベース</title>
<meta name="description" content="大学の教育データのAI利活用に関する日本・EU・英国・米国・韓国の条文比較データベース">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 配色 ── 一橋大学のスクールカラー（茜色）を基調とし、校旗の金を差し色に用いる。
   変数名の navy は配色変更前からのもので、意味は「地の色／濃色」である。 */
:root{
  --navy:#8E2433; --navy-2:#A32B35; --gold:#C9A227; --gold-d:#7A5F0A;
  --cream:#FBF8F6; --paper:#FFFFFF; --line:#E7DCD7; --line-2:#F3ECE8;
  --ink:#241D1E; --body:#4A3F40; --muted:#7B6C6D;
  --warn-bg:#FDF0E7; --warn-fg:#8F3310; --warn-line:#D97757;
  --part-bg:#F8E8B8; --part-fg:#56400A;
  --abs-bg:#F4F1EE; --abs-fg:#6B5F60; --abs-line:#B8ABA8;
  --radius:6px;
  --maxw:1340px;
  --on-navy:#FBF8F6;   /* 茜色の上に乗る文字色 */
  --text-bg:#FBF8F6;   /* 条文ブロックの背景 */
  --header-bg:#A32B35;
  --hdr-fg:#FBF5F4; --hdr-sub:#E6BDC0; --hdr-tab:#EFD3D5;
  --hdr-ph:#CC9EA2; --on-gold:#1B1403;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#B33A45; --navy-2:#2A1317; --gold:#D8B64A; --gold-d:#D8B64A;
    --cream:#140F10; --paper:#1D1719; --line:#3B2D30; --line-2:#251D1F;
    --ink:#EFE8E8; --body:#D2C7C8; --muted:#9A8B8D;
    --warn-bg:#2E1A12; --warn-fg:#F0A37F; --warn-line:#B0553A;
    --part-bg:#3A2F10; --part-fg:#E8CE86;
    --abs-bg:#201A1B; --abs-fg:#9A8B8D; --abs-line:#5A4A4C;
    --on-navy:#FBF5F4; --text-bg:#130F10; --header-bg:#2A1317;
    --hdr-fg:#F5EAEA; --hdr-sub:#C49296; --hdr-tab:#DCB8BB;
    --hdr-ph:#9E7579; --on-gold:#1B1403;
  }
}
:root[data-theme="dark"]{
  --navy:#B33A45; --navy-2:#2A1317; --gold:#D8B64A; --gold-d:#D8B64A;
  --cream:#140F10; --paper:#1D1719; --line:#3B2D30; --line-2:#251D1F;
  --ink:#EFE8E8; --body:#D2C7C8; --muted:#9A8B8D;
  --warn-bg:#2E1A12; --warn-fg:#F0A37F; --warn-line:#B0553A;
  --part-bg:#3A2F10; --part-fg:#E8CE86;
  --abs-bg:#201A1B; --abs-fg:#9A8B8D; --abs-line:#5A4A4C;
  --on-navy:#FBF5F4; --text-bg:#130F10; --header-bg:#2A1317;
  --hdr-fg:#F5EAEA; --hdr-sub:#C49296; --hdr-tab:#DCB8BB;
  --hdr-ph:#9E7579; --on-gold:#1B1403;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--cream); color:var(--body);
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  font-size:15px; line-height:1.75; letter-spacing:.01em;
}
h1,h2,h3,h4{font-family:'Noto Serif JP',Georgia,serif;color:var(--ink);margin:0;line-height:1.3}
a{color:var(--gold-d)}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--header-bg); color:var(--hdr-fg);
  border-bottom:3px solid var(--gold);
}
.hwrap{max-width:var(--maxw);margin:0 auto;padding:14px 16px 12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:21px;color:var(--hdr-fg);font-weight:600;letter-spacing:.02em}
.brand h1 .home{
  font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
  cursor:pointer;border-bottom:1px solid transparent;
}
.brand h1 .home:hover{border-bottom-color:currentColor}
.brand h1 .home:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.brand .sub{font-size:12px;color:var(--hdr-sub);line-height:1.5}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px}
.tab{
  border:0;background:transparent;color:var(--hdr-tab);padding:7px 15px;border-radius:999px;
  font-size:13px;font-weight:500;white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--gold);color:var(--on-gold);font-weight:700}
.search{
  flex:1 1 180px;min-width:150px;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:6px 13px;
}
.search input{
  flex:1;border:0;background:transparent;color:var(--hdr-fg);font-size:13px;outline:none;min-width:0;
  font-family:inherit;
}
.search input::placeholder{color:var(--hdr-ph)}
.search svg{flex:none;opacity:.6}
.iconbtn{
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--hdr-tab);
  border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;
}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}

/* ---------- layout ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 72px}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 16px}

/* ---------- legend ---------- */
.legend{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:11px 13px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:18px;
}
.legend .lab{font-size:12px;font-weight:700;color:var(--ink);margin-right:2px}

/* ---------- status badge ---------- */
.st{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;line-height:1;
  padding:5px 9px;border-radius:4px;white-space:nowrap;border:1px solid transparent;
}
.st-explicit{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.st-partial{background:var(--part-bg);color:var(--part-fg);border-color:var(--gold)}
.st-absent{background:var(--abs-bg);color:var(--abs-fg);border:1.5px dashed var(--abs-line)}
.st-na{background:var(--line-2);color:var(--muted);border-color:var(--line)}
.st-todo{background:transparent;color:var(--muted);border:1.5px dotted var(--line)}

.vflag{
  display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;
  padding:4px 7px;border-radius:4px;white-space:nowrap;
  background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);
}

/* ---------- matrix ---------- */
.mxbox{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;margin-bottom:26px;-webkit-overflow-scrolling:touch;
}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:13px}
table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--line-2)}
table.mx thead th{
  position:sticky;top:0;z-index:3;background:var(--paper);
  border-bottom:2px solid var(--line);
  font-size:12px;font-weight:700;color:var(--ink);padding:10px 8px;text-align:center;
  font-family:'Noto Sans JP',sans-serif;
}
table.mx thead th:first-child{text-align:left;left:0;z-index:4;padding-left:14px}
table.mx tbody th{
  position:sticky;left:0;z-index:2;background:var(--paper);
  text-align:left;font-weight:500;font-size:12.5px;color:var(--ink);
  padding:9px 12px 9px 14px;border-right:1px solid var(--line);
  min-width:190px;max-width:230px;font-family:'Noto Sans JP',sans-serif;
  line-height:1.45;
}
table.mx tbody tr:hover th,table.mx tbody tr:hover td{background:var(--line-2)}
.mxcell{width:100%;border:0;background:transparent;padding:8px 5px;display:block;text-align:center}
.mxcell:hover .st{outline:2px solid var(--gold);outline-offset:1px}
table.mx tbody th button{
  border:0;background:transparent;text-align:left;padding:0;color:inherit;
  font:inherit;text-decoration:underline;text-decoration-color:var(--line);
  text-underline-offset:3px;
}
table.mx tbody th button:hover{text-decoration-color:var(--gold)}

/* ---------- axis detail ---------- */
.axhead{
  background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--gold);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
}
.axhead h2{font-size:23px;margin-bottom:9px}
.axhead .q{font-size:14px;color:var(--body);margin:0 0 10px}
.thesis{
  font-size:13px;color:var(--ink);background:var(--line-2);
  border-radius:4px;padding:10px 13px;margin:0;
}
.thesis b{color:var(--gold-d)}

/* 論点ごとの「日本と海外の比較」要約 */
.cmp{
  background:var(--text-bg);border:1px solid var(--line);
  border-left:4px solid var(--gold);border-radius:0 4px 4px 0;
  padding:13px 15px;margin:0 0 11px;
}
.cmp h3{
  font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-d);
  margin:0 0 6px;
}
.cmp p{
  font-size:14px;line-height:1.95;color:var(--ink);margin:0;
  font-family:'Noto Serif JP',Georgia,serif;
}

.grid5{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:28px}
@media(min-width:760px){.grid5{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1120px){.grid5{grid-template-columns:repeat(3,1fr)}}

.jcard{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.jcard.hl{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.25)}
.jcard .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.jcard h3{font-size:18px}
.jcard .sum{font-size:13.5px;margin:0;color:var(--body)}
.memo{
  font-size:12.5px;color:var(--ink);background:var(--line-2);
  border-left:3px solid var(--gold);border-radius:0 4px 4px 0;padding:9px 11px;margin:0;
}
.memo::before{content:'本稿メモ　';font-weight:700;color:var(--gold-d)}
.refs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}

/* ---------- provision ---------- */
.prov{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  padding:13px 14px;display:flex;flex-direction:column;gap:9px;
}
.prov .ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prov .inst{font-size:11.5px;font-weight:700;color:var(--gold-d);letter-spacing:.03em}
.prov .cite{font-size:14.5px;font-weight:700;color:var(--ink);font-family:'Noto Serif JP',serif}
.prov .ptitle{font-size:12.5px;color:var(--muted)}
.prov .text{
  font-family:'Noto Serif JP',Georgia,serif;font-size:14px;line-height:1.95;
  color:var(--ink);margin:0;padding:11px 13px;background:var(--text-bg);
  border:1px solid var(--line-2);border-radius:4px;
}
/* 条文全文（原文） */
.fullwrap{margin:0}
.fullwrap > summary{
  cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--gold-d);list-style:none;padding:3px 0;
}
.fullwrap > summary::-webkit-details-marker{display:none}
.fullwrap > summary::before{content:'▸ ';font-weight:400}
.fullwrap[open] > summary::before{content:'▾ '}
.prov .full{
  font-family:'Noto Serif JP',Georgia,serif;font-size:13.5px;line-height:2.0;
  color:var(--ink);margin:6px 0 0;padding:12px 14px;background:var(--text-bg);
  border:1px solid var(--line);border-radius:4px;
  white-space:pre-wrap;overflow-wrap:break-word;
}
.prov .full.en{font-family:Georgia,'Times New Roman',serif;line-height:1.85}
.prov .flab{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);
  display:block;margin:9px 0 0;
}
.prov .nofull{
  font-size:11.5px;color:var(--gold-d);margin:0;
}
/* ---------- 用語集 ---------- */
.termhead{margin:0 0 18px}
.termhead h2{font-size:19px;color:var(--ink);margin:0 0 8px;font-weight:700}
.termhead .tcount{font-size:12px;color:var(--muted);margin:8px 0 0}
.tcat{
  font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gold-d);
  margin:26px 0 10px;display:flex;align-items:center;gap:9px;
}
.tcat span{
  font-size:11px;font-weight:700;color:var(--muted);background:var(--line-2);
  border-radius:999px;padding:2px 8px;letter-spacing:0;
}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.term{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;
}
.term h4{
  font-size:15px;font-weight:700;color:var(--ink);margin:0 0 7px;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;line-height:1.5;
}
.term h4 .rd{font-size:11px;font-weight:400;color:var(--muted)}
.term h4 .en{font-size:11.5px;font-weight:400;color:var(--gold-d);font-style:italic}
.tdef{
  font-family:'Noto Serif JP',Georgia,serif;font-size:13.5px;line-height:1.95;
  color:var(--body);margin:0;
}
.tlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tlink{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--line-2);color:var(--body);
}
.tlink:hover{border-color:var(--navy);color:var(--navy)}
.tlink.ax{background:transparent;border-style:dashed;color:var(--gold-d);border-color:var(--gold)}
.tlink.ax:hover{background:var(--part-bg);color:var(--part-fg)}
/* ---------- 判例 ---------- */
.caselist{display:grid;gap:13px;grid-template-columns:1fr}
@media(min-width:1040px){.caselist{grid-template-columns:repeat(2,1fr)}}
.case{
  background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--gold);
  border-radius:var(--radius);padding:15px 17px;
}
.case .ctop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:0 0 8px}
.case .ord{
  font-size:11px;font-weight:700;color:var(--on-gold);background:var(--gold);
  border-radius:999px;min-width:21px;text-align:center;padding:2px 7px;letter-spacing:0;
}
.case .court{font-size:11.5px;font-weight:700;color:var(--gold-d)}
.case .cdate{font-size:11.5px;color:var(--muted)}
.case h3{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 5px;line-height:1.6}
.case .cmeta{font-size:11.5px;color:var(--muted);margin:0 0 9px;line-height:1.8}
.case .hold{
  font-family:'Noto Serif JP',Georgia,serif;font-size:13.5px;line-height:1.95;
  color:var(--body);margin:0;
}
.case .hlab{
  display:block;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  color:var(--gold-d);margin:0 0 4px;
}
.case ul.pts{margin:10px 0 0;padding:0 0 0 1.05em;list-style:disc}
.case ul.pts li{font-size:13px;line-height:1.9;color:var(--body);margin:0 0 4px}
.case .csrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.nolink{
  font-size:11px;color:var(--muted);border:1px dashed var(--line);
  border-radius:999px;padding:4px 9px;
}

/* ---------- 文献 ---------- */
.rnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.rnav button{
  font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--line-2);color:var(--body);
}
.rnav button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.slist{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:1040px){.slist{grid-template-columns:repeat(2,1fr)}}
.study{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;
}
.study .stop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.study .kind{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--gold-d);
  border:1px solid var(--gold);border-radius:999px;padding:2px 8px;
}
.study h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.6}
.study .au{font-size:12.5px;color:var(--ink);margin:0 0 3px}
.study .vn{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.8}
.study .note{
  font-family:'Noto Serif JP',Georgia,serif;font-size:13px;line-height:1.95;
  color:var(--body);margin:0;
}
.doi{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;text-decoration:none;
  border:1px solid var(--gold);background:transparent;color:var(--gold-d);
}
.doi:hover{background:var(--part-bg);color:var(--part-fg)}
.btab{
  font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--gold-d);
  margin:26px 0 10px;display:flex;align-items:center;gap:9px;
}
.btab span{
  font-size:11px;font-weight:700;color:var(--muted);background:var(--line-2);
  border-radius:999px;padding:2px 8px;letter-spacing:0;
}
.blist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.blist li{
  font-size:13px;line-height:1.95;color:var(--body);
  padding:7px 10px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.blist li.bsub{
  border-bottom:0;font-weight:700;color:var(--gold-d);font-size:12px;
  padding:14px 10px 2px;letter-spacing:.06em;
}
.blist li .bn{font-size:10.5px;color:var(--muted);min-width:2.2em;flex:none}
.blist li .bt{flex:1 1 20em;min-width:0}
.blist .bl{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;text-decoration:none;
  border:1px solid var(--line);background:var(--line-2);color:var(--body);flex:none;
}
.blist .bl:hover{border-color:var(--navy);color:var(--navy)}
.blist .bfn{font-size:10.5px;color:var(--gold-d);flex:none}

@keyframes flashbg{0%{background:var(--part-bg)}100%{background:var(--paper)}}
.prov.flash,.case.flash,.study.flash{animation:flashbg 1.6s ease-out}
@media(max-width:560px){ .tlist{grid-template-columns:1fr} }

/* 論点が未選択のときの案内 */
.pickhint{
  font-size:13px;color:var(--muted);text-align:center;
  margin:18px auto 4px;max-width:46em;line-height:1.9;
}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:11px;padding:3px 8px;border-radius:999px;
}
.chip:hover{border-color:var(--gold);color:var(--gold-d)}
.srcl{font-size:11.5px}

/* ---------- instrument picker ---------- */
.ipick{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:22px}
@media(min-width:860px){.ipick{grid-template-columns:repeat(5,1fr)}}
.jgroup{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.jgroup h4{font-size:13px;color:var(--gold-d);margin-bottom:9px;letter-spacing:.06em}
.ibtn{
  display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:transparent;color:var(--ink);border-radius:4px;
  padding:7px 10px;font-size:12.5px;margin-bottom:6px;line-height:1.4;
}
.ibtn:hover{border-color:var(--gold)}
.ibtn[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy);font-weight:700}
.ibtn .k{font-size:10px;opacity:.65;display:block}

.sectionhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.sectionhead h2{font-size:20px}
.sectionhead .n{font-size:12px;color:var(--muted)}
.fullname{font-size:12px;color:var(--muted);margin:0 0 16px}

.plist{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.plist{grid-template-columns:repeat(2,1fr)}}

/* mini comparison strip inside a provision */
.strip{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.strip .sl{font-size:10.5px;color:var(--muted);margin-right:3px}
.dot{
  width:30px;height:20px;border-radius:3px;display:inline-flex;align-items:center;
  justify-content:center;font-size:9.5px;font-weight:700;border:1px solid transparent;
}

/* 狭い画面ではマトリクスを詰めて、一度に見える法域を増やす */
@media(max-width:560px){
  .hwrap{padding:11px 14px 10px}
  .brand h1{font-size:18px}
  .brand .sub{font-size:11px}
  .toolbar{margin-top:10px;gap:6px}
  table.mx{min-width:512px}
  table.mx thead th{font-size:11px;padding:8px 3px}
  table.mx thead th:first-child{padding-left:10px}
  table.mx tbody th{
    min-width:134px;max-width:134px;font-size:11.5px;
    padding:8px 7px 8px 10px;line-height:1.4;
  }
  .mxcell{padding:7px 2px}
  .st{font-size:10.5px;padding:4px 6px}
  .axhead{padding:15px 16px}
  .axhead h2{font-size:20px}
  .jcard{padding:14px}
}

/* ---------- 原典サイトのリンク集 ---------- */
.srcbox{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:18px;
}
.srcbox > summary{
  cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);
  list-style:none;display:flex;align-items:center;gap:7px;
}
.srcbox > summary::-webkit-details-marker{display:none}
.srcbox > summary::before{content:'▸';color:var(--gold-d);font-size:11px}
.srcbox[open] > summary::before{content:'▾'}
.srcbox > summary span{font-weight:400;color:var(--muted)}
.srcgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.srclink{
  display:inline-flex;flex-direction:column;gap:1px;
  border:1px solid var(--line);border-radius:4px;padding:6px 10px;
  text-decoration:none;background:transparent;max-width:100%;
}
.srclink:hover{border-color:var(--gold);background:var(--line-2)}
.srclink b{font-size:12.5px;color:var(--ink);font-weight:600}
.srclink i{font-size:10.5px;color:var(--muted);font-style:normal}
.srclink em{font-size:10px;color:var(--gold-d);font-style:normal;font-weight:700;letter-spacing:.05em}

.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13.5px}
footer{
  max-width:var(--maxw);margin:0 auto;padding:22px 16px 40px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.8;
}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;background:var(--gold);color:var(--on-gold);padding:8px 12px;z-index:99;border-radius:4px}
</style>
</head>
<body>
<a class="skip" href="#content">本文へ</a>

<header>
  <div class="hwrap">
    <div class="brand">
      <h1><button type="button" class="home" onclick="App.goHome()" title="最初の画面に戻る">教育データ情報法データベース</button></h1>
      <span class="sub" id="subtitle"></span>
    </div>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="表示モード">
        <button class="tab" role="tab" id="tab-axis"  aria-selected="true"  onclick="App.setMode('axis')">論点で比較</button>
        <button class="tab" role="tab" id="tab-inst"  aria-selected="false" onclick="App.setMode('inst')">法令別で読む</button>
        <button class="tab" role="tab" id="tab-case" aria-selected="false" onclick="App.setMode('case')">判例</button>
        <button class="tab" role="tab" id="tab-ref"  aria-selected="false" onclick="App.setMode('ref')">文献</button>
        <button class="tab" role="tab" id="tab-term" aria-selected="false" onclick="App.setMode('term')">用語集</button>
      </div>
      <label class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="条文・論点・判例・文献を検索" autocomplete="off" aria-label="検索">
      </label>
      <button class="iconbtn" id="vonly" aria-pressed="false" onclick="App.toggleVerified()">要検証のみ</button>
      <button class="iconbtn" id="themebtn" onclick="App.toggleTheme()">配色</button>
    </div>
  </div>
</header>

<main id="content">
  <p class="hint" id="hint"></p>

  <div class="legend">
    <span class="lab">凡例</span>
    <span class="st st-explicit">明文の規定</span>
    <span class="st st-partial">部分的・解釈</span>
    <span class="st st-absent">規定なし</span>
    <span class="st st-na">対象外</span>
    <span class="st st-todo">未記入</span>
    <span class="vflag">要検証</span>
  </div>

  <details class="srcbox" id="srcbox" open>
    <summary>原典サイト　<span>条文を直接あたるときはここから</span></summary>
    <div class="srcgrid" id="srcgrid"></div>
  </details>

  <div id="view"></div>
</main>

<footer>
  <div id="foot"></div>
</footer>

<script src="data.js?v=f42832c6bc"></script>
<script>
(function(){
'use strict';

var DB = window.DB;
var ST = {
  explicit:{label:'明文の規定', short:'明文'},
  partial: {label:'部分的・解釈', short:'部分'},
  absent:  {label:'規定なし',    short:'なし'},
  na:      {label:'対象外',      short:'対象外'},
  todo:    {label:'未記入',      short:'未記入'}
};

/* ---------- helpers ---------- */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function byId(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
function inst(id){ return byId(DB.instruments,id); }
function axis(id){ return byId(DB.axes,id); }
function jur(id){ return byId(DB.jurisdictions,id); }
function prov(id){ return byId(DB.provisions,id); }
function cell(axisId,jurId){
  for(var i=0;i<DB.cells.length;i++){
    if(DB.cells[i].axis===axisId && DB.cells[i].jur===jurId) return DB.cells[i];
  }
  return {axis:axisId,jur:jurId,status:'todo',summary:'',memo:'',refs:[]};
}
function stClass(s){ return 'st st-'+(ST[s]?s:'todo'); }
function isVerified(o){ return o.verified !== false; }

/* ---------- state ---------- */
// axis は初期状態では未選択。表の論点をクリックするまで下に何も出さない。
var S = { mode:'axis', axis:null, inst:DB.instruments[0].id, q:'', vonly:false, ref:'studies' };

function matchText(o, parts){
  var hay = parts.join(' ').toLowerCase();
  var terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  for(var i=0;i<terms.length;i++){ if(hay.indexOf(terms[i])<0) return false; }
  return true;
}

/* ---------- renderers ---------- */
function badge(status){
  var m = ST[status]||ST.todo;
  return '<span class="'+stClass(status)+'">'+esc(m.label)+'</span>';
}
function vbadge(o){
  return isVerified(o) ? '' : '<span class="vflag">要検証</span>';
}

// 条文の全文。原文（日本法は日本語、EU・英米は英語、韓国は韓国語）と、あれば公式英訳。
function renderFull(p){
  var hasJa = !!p.full, hasEn = !!p.fullEn;
  if(!hasJa && !hasEn){
    // overview は単一の条文ではない項目（標準・規則全体の概要など）
    if(p.overview) return '';
    return '<p class="nofull">条文全文は未取得です。出典のリンクから原典をご確認ください。</p>';
  }
  var body = '';
  if(hasJa){
    var lat = /^[\x00-\x7F\s]*$/.test(p.full.slice(0, 80));
    if(hasEn) body += '<span class="flab">原文</span>';
    body += '<p class="full'+(lat?' en':'')+'">'+esc(p.full)+'</p>';
  }
  if(hasEn){
    body += '<span class="flab">公式英訳</span>';
    body += '<p class="full en">'+esc(p.fullEn)+'</p>';
  }
  return '<details class="fullwrap" open><summary>条文全文</summary>'+body+'</details>';
}

function renderProvision(p, opts){
  opts = opts||{};
  var it = inst(p.inst) || {name:'?',jur:'',full:'',src:''};
  var h = '<article class="prov" id="p-'+esc(p.id)+'">';
  h += '<div class="ptop">';
  h += '<span class="inst">'+esc(it.name)+'</span>';
  h += '<span class="cite">'+esc(p.cite)+'</span>';
  if(p.title) h += '<span class="ptitle">'+esc(p.title)+'</span>';
  h += badge(p.status)+vbadge(p);
  h += '</div>';
  if(p.text) h += '<p class="text">'+esc(p.text)+'</p>';
  h += renderFull(p);
  if(p.memo) h += '<p class="memo">'+esc(p.memo)+'</p>';

  if(opts.strip && p.axes && p.axes.length){
    var a0 = p.axes[0];
    h += '<div class="strip"><span class="sl">'+esc(axis(a0)?axis(a0).label:a0)+'：</span>';
    for(var j=0;j<DB.jurisdictions.length;j++){
      var jj = DB.jurisdictions[j], c = cell(a0, jj.id);
      var m = ST[c.status]||ST.todo;
      h += '<span class="dot '+stClass(c.status)+'" title="'+esc(jj.label+'：'+m.label)+'">'+esc(jj.short)+'</span>';
    }
    h += '</div>';
  }

  if(p.axes && p.axes.length){
    h += '<div class="chips">';
    for(var k=0;k<p.axes.length;k++){
      var ax = axis(p.axes[k]);
      if(!ax) continue;
      h += '<button class="chip" onclick="App.goAxis(\''+esc(ax.id)+'\')">'+esc(ax.label)+'</button>';
    }
    h += '</div>';
  }
  // 条文ごとの出典。無ければその法令の出典にフォールバックする。
  var srcUrl = p.src || it.src;
  if(srcUrl){
    var slab = p.src ? 'この条文の出典を開く' : '出典（'+esc(it.name)+'）を開く';
    h += '<a class="srcl" href="'+esc(srcUrl)+'" target="_blank" rel="noopener">'+slab+'</a>';
  }
  h += '</article>';
  return h;
}

function renderMatrix(){
  var h = '<div class="mxbox"><table class="mx"><thead><tr><th scope="col">論点</th>';
  for(var j=0;j<DB.jurisdictions.length;j++){
    h += '<th scope="col">'+esc(DB.jurisdictions[j].label)+'</th>';
  }
  h += '</tr></thead><tbody>';

  var shown = 0;
  for(var a=0;a<DB.axes.length;a++){
    var ax = DB.axes[a];
    // search filter: keep the row if the axis or any of its cells match
    var parts = [ax.label, ax.q||'', ax.compare||'', ax.thesis||''];
    for(var jj=0;jj<DB.jurisdictions.length;jj++){
      var c0 = cell(ax.id, DB.jurisdictions[jj].id);
      parts.push(c0.summary||'', c0.memo||'');
    }
    if(S.q && !matchText(ax, parts)) continue;
    shown++;

    h += '<tr><th scope="row"><button onclick="App.goAxis(\''+esc(ax.id)+'\')">'+esc(ax.label)+'</button></th>';
    for(var j2=0;j2<DB.jurisdictions.length;j2++){
      var jd = DB.jurisdictions[j2], c = cell(ax.id, jd.id);
      var m = ST[c.status]||ST.todo;
      h += '<td><button class="mxcell" title="'+esc(jd.label+'：'+m.label)+'" '+
           'onclick="App.goAxis(\''+esc(ax.id)+'\',\''+esc(jd.id)+'\')">'+
           '<span class="'+stClass(c.status)+'">'+esc(m.short)+'</span></button></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  if(!shown) h = '<div class="mxbox"><p class="empty">一致する論点がありません。</p></div>';
  return h;
}

function renderAxisView(hlJur){
  var ax = axis(S.axis);
  var h = renderMatrix();
  if(!ax){
    // 論点が未選択のときは表だけを出す
    h += '<p class="pickhint">表の論点名またはマスをクリックすると、その論点について'
       + '日本と海外の比較と各法域の詳細が表示されます。</p>';
    return h;
  }

  h += '<section class="axhead">';
  h += '<h2>'+esc(ax.label)+'</h2>';
  if(ax.q) h += '<p class="q">'+esc(ax.q)+'</p>';
  if(ax.compare) h += '<div class="cmp"><h3>日本と海外の比較</h3><p>'+esc(ax.compare)+'</p></div>';
  if(ax.thesis) h += '<p class="thesis"><b>本稿との接続　</b>'+esc(ax.thesis)+'</p>';
  h += '</section>';

  h += '<div class="grid5">';
  for(var j=0;j<DB.jurisdictions.length;j++){
    var jd = DB.jurisdictions[j], c = cell(ax.id, jd.id);
    h += '<section class="jcard'+(hlJur===jd.id?' hl':'')+'">';
    h += '<div class="top"><h3>'+esc(jd.label)+'</h3>'+badge(c.status)+vbadge(c)+'</div>';
    h += '<p class="sum">'+(c.summary ? esc(c.summary) : '<em>未記入</em>')+'</p>';
    if(c.memo) h += '<p class="memo">'+esc(c.memo)+'</p>';

    var refs = (c.refs||[]);
    if(refs.length){
      h += '<ul class="refs">';
      for(var r=0;r<refs.length;r++){
        var p = prov(refs[r]);
        if(!p) continue;
        if(S.vonly && isVerified(p)) continue;
        h += '<li>'+renderProvision(p)+'</li>';
      }
      h += '</ul>';
    }
    h += '</section>';
  }
  h += '</div>';
  return h;
}

// ───────── 用語集
var CATLAB = { jp:'日本法', eu:'EU法', uk:'英国法', us:'米国法', kr:'韓国法', gen:'共通・分析の用語' };
var CATORD = ['jp','eu','uk','us','kr','gen'];

function renderTermView(){
  var gl = DB.glossary;
  if(!gl || !gl.length){
    // データが古いまま読み込まれている場合に、検索結果ゼロと取り違えないようにする
    return '<section class="termhead"><h2>用語集</h2></section>'
         + '<div class="mxbox"><p class="empty">用語集のデータが読み込めていません。'
         + 'ブラウザが古いデータを保持している可能性があります。'
         + '再読み込み（Windows は Ctrl＋Shift＋R、Mac は Command＋Shift＋R）をお試しください。</p></div>';
  }
  var hits = [];
  for(var i=0;i<gl.length;i++){
    var g = gl[i];
    if(S.q && !matchText(g,[g.term,g.reading||'',g.en||'',g.def])) continue;
    hits.push(g);
  }
  var h = '<section class="termhead">';
  h += '<h2>用語集</h2>';
  h += '<p class="q">本データベースに出てくる用語を、収録した条文に即して説明する。'
     + '見出し語の下の帯から、その用語の根拠となる条文と関連する論点に移動できる。</p>';
  h += '<p class="tcount">'+hits.length+' 件'+(S.q?('／全 '+gl.length+' 件中'):'')+'</p>';
  h += '</section>';

  if(!hits.length) return h + '<div class="mxbox"><p class="empty">一致する用語がありません。</p></div>';

  for(var c=0;c<CATORD.length;c++){
    var cat = CATORD[c];
    var rows = hits.filter(function(g){ return g.cat===cat; });
    if(!rows.length) continue;
    h += '<h3 class="tcat">'+esc(CATLAB[cat])+'<span>'+rows.length+'</span></h3>';
    h += '<div class="tlist">';
    for(var r=0;r<rows.length;r++) h += renderTerm(rows[r]);
    h += '</div>';
  }
  return h;
}

function renderTerm(g){
  var h = '<article class="term" id="'+esc(g.id)+'">';
  h += '<h4>'+esc(g.term);
  if(g.reading) h += '<span class="rd">'+esc(g.reading)+'</span>';
  if(g.en) h += '<span class="en">'+esc(g.en)+'</span>';
  h += '</h4>';
  h += '<p class="tdef">'+esc(g.def)+'</p>';

  var bits = '';
  for(var i=0;i<(g.refs||[]).length;i++){
    var p = DB.provisions.filter(function(x){ return x.id===g.refs[i]; })[0];
    if(!p) continue;
    var it = inst(p.inst) || {name:'?'};
    bits += '<button class="tlink" onclick="App.goProv(\''+esc(p.id)+'\')">'
          + esc(it.name)+' '+esc(p.cite)+'</button>';
  }
  for(var a=0;a<(g.axes||[]).length;a++){
    var ax = axis(g.axes[a]);
    if(!ax) continue;
    bits += '<button class="tlink ax" onclick="App.goAxis(\''+esc(ax.id)+'\')">'
          + esc(ax.label)+'</button>';
  }
  if(bits) h += '<div class="tlinks">'+bits+'</div>';
  return h + '</article>';
}

// ───────── 判例（登場順）
function renderCaseView(){
  var cs = (DB.cases||[]).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  if(!cs.length){
    return '<section class="termhead"><h2>判例</h2></section>'
         + '<div class="mxbox"><p class="empty">判例のデータが読み込めていません。'
         + '再読み込み（Windows は Ctrl＋Shift＋R、Mac は Command＋Shift＋R）をお試しください。</p></div>';
  }
  var hits = cs.filter(function(c){
    if(!S.q) return true;
    return matchText(c,[c.name||'',c.court||'',c.dateJa||'',c.docket||'',c.reporters||'',
                        c.holding||'',(c.points||[]).join(' '),c.refLaws||'',c.thesis||'']);
  });
  var h = '<section class="termhead"><h2>判例</h2>';
  h += '<p class="q">本文及び脚注で引用した裁判例を，出てくる順に並べている。'
     + '裁判要旨は「公式」と付したものは裁判所の裁判例検索に掲載された要旨であり，'
     + 'それ以外は作成者による要約である。</p>';
  h += '<p class="tcount">'+hits.length+' 件'+(S.q?('／全 '+cs.length+' 件中'):'')+'</p>';
  h += '</section>';
  if(!hits.length) return h+'<div class="mxbox"><p class="empty">一致する判例がありません。</p></div>';
  h += '<div class="caselist">';
  for(var i=0;i<hits.length;i++) h += renderCase(hits[i]);
  return h + '</div>';
}

function renderCase(c){
  var h = '<article class="case" id="c-'+esc(c.id)+'">';
  h += '<div class="ctop"><span class="ord">'+esc(c.order)+'</span>'
     + '<span class="court">'+esc(c.court)+'</span>'
     + '<span class="cdate">'+esc(c.dateJa||c.date)+'</span>'
     + (c.at?'<span class="cdate">'+esc(c.at)+'</span>':'')+'</div>';
  h += '<h3>'+esc(c.name)+'</h3>';
  var meta = [];
  if(c.docket) meta.push(c.docket);
  if(c.reporters) meta.push(c.reporters);
  if(c.below) meta.push(c.below);
  if(c.refLaws) meta.push('参照法条：'+c.refLaws);
  if(meta.length) h += '<p class="cmeta">'+esc(meta.join('／'))+'</p>';
  if(c.holding){
    h += '<p class="hold"><span class="hlab">裁判要旨'
       + (c.holdingSrc==='official'?'（公式）':'（要約）')+'</span>'+esc(c.holding)+'</p>';
  }
  if(c.points && c.points.length){
    h += '<ul class="pts">';
    for(var i=0;i<c.points.length;i++) h += '<li>'+esc(c.points[i])+'</li>';
    h += '</ul>';
  }
  if(c.thesis) h += '<p class="thesis" style="margin-top:11px"><b>本稿との接続　</b>'+esc(c.thesis)+'</p>';

  var bits = '';
  for(var r=0;r<(c.refs||[]).length;r++){
    var pr = prov(c.refs[r]);
    if(!pr) continue;
    var it = inst(pr.inst) || {name:'?'};
    bits += '<button class="tlink" onclick="App.goProv(\''+esc(pr.id)+'\')">'
          + esc(it.name)+' '+esc(pr.cite)+'</button>';
  }
  for(var a=0;a<(c.axes||[]).length;a++){
    var ax = axis(c.axes[a]);
    if(!ax) continue;
    bits += '<button class="tlink ax" onclick="App.goAxis(\''+esc(ax.id)+'\')">'+esc(ax.label)+'</button>';
  }
  if(bits) h += '<div class="tlinks">'+bits+'</div>';

  var sl = '';
  for(var k=0;k<(c.srcs||[]).length;k++){
    var sv = c.srcs[k];
    if(sv.url) sl += '<a class="bl" href="'+esc(sv.url)+'" target="_blank" rel="noopener">'+esc(sv.label)+'</a>';
    else sl += '<span class="nolink">'+esc(sv.label)+'</span>';
  }
  if(sl) h += '<div class="csrc">'+sl+'</div>';
  return h + '</article>';
}

// ───────── 文献（先行研究と参考文献）
function renderRefView(){
  var st = (DB.studies||[]).slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  var bb = (DB.biblio||[]);
  if(!st.length && !bb.length){
    return '<section class="termhead"><h2>文献</h2></section>'
         + '<div class="mxbox"><p class="empty">文献のデータが読み込めていません。'
         + '再読み込み（Windows は Ctrl＋Shift＋R、Mac は Command＋Shift＋R）をお試しください。</p></div>';
  }
  var hs = st.filter(function(x){
    if(!S.q) return true;
    return matchText(x,[x.authors||'',x.title||'',x.venue||'',x.note||'',x.doi||'',x.thesis||'',x.kind||'']);
  });
  var hb = bb.filter(function(x){
    if(x.kind==='sub') return !S.q;
    if(!S.q) return true;
    return matchText(x,[x.text||'',x.sec||'',x.url||'']);
  });

  var h = '<section class="termhead"><h2>文献</h2>';
  h += '<p class="q">前半は先行研究を，本文で最初に引く順に並べたもの。'
     + '後半は参考文献の全件を，区分ごとに並べたもの。'
     + 'DOIのあるものはDOIへ，それ以外は原典のページへ繋いである。</p>';
  h += '<div class="rnav">'
     + '<button aria-pressed="'+(S.ref!=='biblio')+'" onclick="App.setRef(\'studies\')">先行研究 '+hs.length+'</button>'
     + '<button aria-pressed="'+(S.ref==='biblio')+'" onclick="App.setRef(\'biblio\')">参考文献 '
     +   hb.filter(function(x){return x.kind!=='sub';}).length+'</button>'
     + '</div></section>';

  if(S.ref!=='biblio'){
    if(!hs.length) return h+'<div class="mxbox"><p class="empty">一致する先行研究がありません。</p></div>';
    h += '<div class="slist">';
    for(var i=0;i<hs.length;i++) h += renderStudy(hs[i]);
    h += '</div>';
    return h;
  }

  var refs = hb.filter(function(x){ return x.kind!=='sub'; });
  if(!refs.length) return h+'<div class="mxbox"><p class="empty">一致する参考文献がありません。</p></div>';
  var secs = [];
  for(var j=0;j<hb.length;j++){ if(secs.indexOf(hb[j].sec)<0) secs.push(hb[j].sec); }
  for(var sx=0;sx<secs.length;sx++){
    var rows = hb.filter(function(x){ return x.sec===secs[sx]; });
    var n = rows.filter(function(x){ return x.kind!=='sub'; }).length;
    if(!n) continue;
    h += '<h3 class="btab">'+esc(secs[sx])+'<span>'+n+'</span></h3><ul class="blist">';
    for(var rx=0;rx<rows.length;rx++) h += renderBib(rows[rx]);
    h += '</ul>';
  }
  return h;
}

function renderStudy(x){
  var h = '<article class="study" id="s-'+esc(x.id)+'">';
  h += '<div class="stop"><span class="ord">'+esc(x.order)+'</span>'
     + '<span class="kind">'+esc(x.kind||'')+'</span>'
     + (x.at?'<span class="cdate">'+esc(x.at)+'</span>':'')+'</div>';
  h += '<h3>'+esc(x.title)+'</h3>';
  h += '<p class="au">'+esc(x.authors)+'</p>';
  var vn = [];
  if(x.venue) vn.push(x.venue);
  if(x.volume) vn.push(x.volume);
  if(x.year) vn.push(x.date||x.year);
  if(x.pages) vn.push(x.pages);
  if(vn.length) h += '<p class="vn">'+esc(vn.join('／'))+'</p>';
  if(x.note) h += '<p class="note">'+esc(x.note)+'</p>';
  if(x.thesis) h += '<p class="thesis" style="margin-top:11px"><b>本稿との接続　</b>'+esc(x.thesis)+'</p>';

  var bits = '';
  for(var r=0;r<(x.refs||[]).length;r++){
    var pr = prov(x.refs[r]);
    if(!pr) continue;
    var it = inst(pr.inst) || {name:'?'};
    bits += '<button class="tlink" onclick="App.goProv(\''+esc(pr.id)+'\')">'
          + esc(it.name)+' '+esc(pr.cite)+'</button>';
  }
  for(var a=0;a<(x.axes||[]).length;a++){
    var ax = axis(x.axes[a]);
    if(!ax) continue;
    bits += '<button class="tlink ax" onclick="App.goAxis(\''+esc(ax.id)+'\')">'+esc(ax.label)+'</button>';
  }
  if(bits) h += '<div class="tlinks">'+bits+'</div>';
  if(x.url){
    var lab = x.doi ? ('DOI '+x.doi) : '原典を開く';
    h += '<div class="csrc"><a class="doi" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(lab)+'</a></div>';
  }
  return h + '</article>';
}

function renderBib(x){
  if(x.kind==='sub') return '<li class="bsub">'+esc(x.text)+'</li>';
  var h = '<li><span class="bn">'+esc(x.order)+'</span><span class="bt">'+esc(x.text)+'</span>';
  if(x.thesis) h += '<span class="bfn">'+esc(x.thesis)+'</span>';
  if(x.study) h += '<button class="bl" onclick="App.goStudy(\''+esc(x.study)+'\')">先行研究</button>';
  if(x.case)  h += '<button class="bl" onclick="App.goCase(\''+esc(x.case)+'\')">判例</button>';
  if(x.url)   h += '<a class="bl" href="'+esc(x.url)+'" target="_blank" rel="noopener">'
                 + (x.doi?'DOI':'原典')+'</a>';
  return h + '</li>';
}

function renderInstView(){
  var h = '<div class="ipick">';
  for(var j=0;j<DB.jurisdictions.length;j++){
    var jd = DB.jurisdictions[j];
    h += '<div class="jgroup"><h4>'+esc(jd.label)+'</h4>';
    for(var i=0;i<DB.instruments.length;i++){
      var it = DB.instruments[i];
      if(it.jur!==jd.id) continue;
      var n = 0;
      for(var p=0;p<DB.provisions.length;p++){ if(DB.provisions[p].inst===it.id) n++; }
      h += '<button class="ibtn" aria-pressed="'+(S.inst===it.id)+'" onclick="App.goInst(\''+esc(it.id)+'\')">'+
           esc(it.name)+'<span class="k">'+esc(it.kind)+'・'+n+'件</span></button>';
    }
    h += '</div>';
  }
  h += '</div>';

  var cur = inst(S.inst) || DB.instruments[0];
  // 検索語か「要検証のみ」が有効なときは全法令を横断する。
  var across = !!(S.q || S.vonly);
  var list = [];
  for(var q=0;q<DB.provisions.length;q++){
    var pr = DB.provisions[q];
    var it2 = inst(pr.inst) || {name:'',full:''};
    if(!across && pr.inst!==cur.id) continue;
    if(S.vonly && isVerified(pr)) continue;
    if(S.q && !matchText(pr,[pr.cite,pr.title||'',pr.text||'',pr.full||'',pr.fullEn||'',pr.memo||'',it2.name,it2.full||''])) continue;
    list.push(pr);
  }

  if(across){
    var label = S.q ? ('「'+S.q+'」の検索結果') : '要検証の条文';
    h += '<div class="sectionhead"><h2>'+esc(label)+'</h2><span class="n">'+list.length+' 件・全法令から</span></div>';
    h += '<p class="fullname">検索語を消し、「要検証のみ」を解除すると、選択した法令の条文一覧に戻ります。</p>';
  } else {
    h += '<div class="sectionhead"><h2>'+esc(cur.name)+'</h2><span class="n">'+list.length+' 件</span></div>';
    if(cur.full) h += '<p class="fullname">'+esc(cur.full)+'</p>';
  }

  if(!list.length){
    h += '<p class="empty">該当する条文がありません。検索語や「要検証のみ」を外してみてください。</p>';
  } else {
    h += '<div class="plist">';
    for(var m=0;m<list.length;m++) h += renderProvision(list[m],{strip:true});
    h += '</div>';
  }
  return h;
}

/* ---------- app ---------- */
var hlJur = null;

function render(){
  var modes = ['axis','inst','case','ref','term'];
  for(var mi=0; mi<modes.length; mi++){
    var tb = document.getElementById('tab-'+modes[mi]);
    if(tb) tb.setAttribute('aria-selected', S.mode===modes[mi]);
  }
  // 凡例と案内は行列の説明なので、条文を並べない画面では隠す
  var flat = (S.mode==='term' || S.mode==='case' || S.mode==='ref');
  var lg = document.querySelector('.legend'), hn = document.getElementById('hint');
  if(lg) lg.style.display = flat ? 'none' : '';
  if(hn) hn.style.display = flat ? 'none' : '';
  document.getElementById('view').innerHTML =
    S.mode==='axis' ? renderAxisView(hlJur)
    : S.mode==='term' ? renderTermView()
    : S.mode==='case' ? renderCaseView()
    : S.mode==='ref'  ? renderRefView()
    : renderInstView();
  hlJur = null;
}

function writeHash(){
  if(S.mode==='axis' && !S.axis){
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    return;
  }
  var h = S.mode==='term' ? '#terms'
        : S.mode==='case' ? '#cases'
        : S.mode==='ref'  ? ('#refs='+(S.ref||'studies'))
        : S.mode==='axis' ? ('#axis='+S.axis) : ('#inst='+S.inst);
  if(location.hash !== h) history.replaceState(null,'',h);
}
function readHash(){
  if((location.hash||'')==='#terms'){ S.mode='term'; return; }
  if((location.hash||'')==='#cases'){ S.mode='case'; return; }
  var mr = /^#refs=(studies|biblio)$/.exec(location.hash||'');
  if(mr){ S.mode='ref'; S.ref=mr[1]; return; }
  var m = /^#(axis|inst)=(.+)$/.exec(location.hash||'');
  if(!m) return;
  if(m[1]==='axis' && axis(m[2])){ S.mode='axis'; S.axis=m[2]; }
  if(m[1]==='inst' && inst(m[2])){ S.mode='inst'; S.inst=m[2]; }
}

var App = {
  // タイトルをクリックしたときに最初の画面へ戻す
  goHome:function(){
    S.mode='axis'; S.axis=null; S.q=''; S.vonly=false; hlJur=null;
    var q=document.getElementById('q'); if(q) q.value='';
    var v=document.getElementById('vonly'); if(v) v.setAttribute('aria-pressed','false');
    writeHash(); render(); window.scrollTo(0,0);
  },
  setMode:function(m){ S.mode=m; writeHash(); render(); window.scrollTo(0,0); },
  goAxis:function(id,j){
    S.mode='axis'; S.axis=id; hlJur=j||null; writeHash(); render();
    var el=document.querySelector('.axhead');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },
  goInst:function(id){ S.mode='inst'; S.inst=id; writeHash(); render(); },
  setRef:function(k){ S.ref=k; writeHash(); render(); window.scrollTo(0,0); },
  // 参考文献から、対応する先行研究・判例のカードへ送る
  goStudy:function(id){
    S.mode='ref'; S.ref='studies'; S.q='';
    var q=document.getElementById('q'); if(q) q.value='';
    writeHash(); render();
    var el=document.getElementById('s-'+id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); }
    else window.scrollTo(0,0);
  },
  goCase:function(id){
    S.mode='case'; S.q='';
    var q=document.getElementById('q'); if(q) q.value='';
    writeHash(); render();
    var el=document.getElementById('c-'+id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); }
    else window.scrollTo(0,0);
  },
  // 用語集から条文へ。その条文を含む法令を開き、該当カードまで送る。
  goProv:function(pid){
    var p = DB.provisions.filter(function(x){ return x.id===pid; })[0];
    if(!p) return;
    S.mode='inst'; S.inst=p.inst; S.q='';
    var q=document.getElementById('q'); if(q) q.value='';
    writeHash(); render();
    var el=document.getElementById('p-'+pid);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); }
    else window.scrollTo(0,0);
  },
  toggleVerified:function(){
    S.vonly=!S.vonly;
    document.getElementById('vonly').setAttribute('aria-pressed',S.vonly);
    render();
  },
  toggleTheme:function(){
    var r=document.documentElement;
    var cur=r.getAttribute('data-theme');
    var dark = cur ? cur==='dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  }
};
window.App = App;

/* 原典サイトのリンク集 */
(function(){
  var box = document.getElementById('srcbox'), grid = document.getElementById('srcgrid');
  var list = DB.sources || [];
  if(!list.length){ if(box) box.style.display='none'; return; }
  var h = '';
  for(var i=0;i<list.length;i++){
    var s = list[i], j = jur(s.jur);
    h += '<a class="srclink" href="'+esc(s.url)+'" target="_blank" rel="noopener">'
       +   '<em>'+esc(j ? j.label : s.jur)+'</em>'
       +   '<b>'+esc(s.name)+'</b>'
       +   (s.note ? '<i>'+esc(s.note)+'</i>' : '')
       + '</a>';
  }
  grid.innerHTML = h;
  // 狭い画面では畳んでおく
  if(window.matchMedia && window.matchMedia('(max-width:700px)').matches) box.removeAttribute('open');
})();

/* init */
document.getElementById('subtitle').textContent = DB.meta.subtitle;
document.getElementById('hint').textContent =
  '論点を選ぶと5法域の規律を横に並べて比べられます。色は規律の強さ（明文／部分的／規定なし）を表します。'+
  '法令別の表示では、条文ごとに他法域の状況を小さな帯で示します。';
var nUnver = 0;
for(var vi=0; vi<DB.provisions.length; vi++){ if(DB.provisions[vi].verified===false) nUnver++; }
document.getElementById('foot').innerHTML =
  '最終更新 '+esc(DB.meta.updated)+
  '<br>'+esc(DB.meta.note)+
  '<br>論点 '+DB.axes.length+' ・ 法令等 '+DB.instruments.length+
  ' ・ 条文 '+DB.provisions.length+' 件（うち要検証 '+nUnver+' 件）'+
  ' ・ 用語 '+((DB.glossary||[]).length)+
  '<br>判例 '+((DB.cases||[]).length)+' 件 ・ 先行研究 '+((DB.studies||[]).length)+' 件 ・ 参考文献 '+
  ((DB.biblio||[]).filter(function(b){return b.kind!=='sub';}).length)+' 件';

var qi = document.getElementById('q');
var t=null;
qi.addEventListener('input', function(){
  clearTimeout(t);
  t=setTimeout(function(){ S.q=qi.value.trim(); render(); }, 140);
});
window.addEventListener('hashchange', function(){ readHash(); render(); });

readHash();
render();
})();
</script>
