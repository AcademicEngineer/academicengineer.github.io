<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ともに 医療者教育版 ver2.0｜医療者教育のための成長支援プラットフォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --side:#1E2940; --side-ink:#DDE4F0; --side-muted:#8E9AB2;
  --ink:#1E2940; --muted:#5E6A80; --line:#D9DEE6;
  --me:#F6DF5E; --me-ink:#4A3F00; --them:#9CBDF2; --them-ink:#12305E;
  --gap:#E7A3D6; --gap-ink:#5A1748; --ok:#B9DB97; --ok-ink:#25430C; --clin:#8FD3C8; --clin-ink:#0E3B35;
  --focus:#2F5BD3; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121826; --surface:#1C2433; --side:#0C111B; --side-ink:#DDE4F0; --side-muted:#7F8BA3;
    --ink:#E7ECF4; --muted:#A3AEC2; --line:#2F3A4E;
    --me:#E3CB45; --me-ink:#2D2600; --them:#7FA6E6; --them-ink:#0B1F40;
    --gap:#D584C3; --gap-ink:#3A0B2E; --ok:#9CC678; --ok-ink:#16290A; --clin:#5FB3A6; --clin-ink:#062823; --focus:#8DB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121826; --surface:#1C2433; --side:#0C111B; --side-ink:#DDE4F0; --side-muted:#7F8BA3;
  --ink:#E7ECF4; --muted:#A3AEC2; --line:#2F3A4E;
  --me:#E3CB45; --me-ink:#2D2600; --them:#7FA6E6; --them-ink:#0B1F40;
  --gap:#D584C3; --gap-ink:#3A0B2E; --ok:#9CC678; --ok-ink:#16290A; --clin:#5FB3A6; --clin-ink:#062823; --focus:#8DB0FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow-wrap:anywhere;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
a{color:inherit}

.shell{display:grid;grid-template-columns:232px 1fr;height:100%}
aside{background:var(--side);color:var(--side-ink);padding:20px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;padding:0 8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--me);transform:rotate(-6deg)}
.brand i+i{background:var(--them);transform:rotate(5deg);margin-left:-8px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--side-muted);letter-spacing:0}
.rolebox{padding:0 4px}
.rolebox label{font-size:12px;color:var(--side-muted);display:block;margin:0 0 4px 4px}
.rolebox select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #3A4660;background:#28344D;color:var(--side-ink)}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:12px;color:var(--side-muted);margin:12px 10px 4px}
nav.side a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--side-ink)}
nav.side a:hover{background:#2A3550}
nav.side a[aria-current="page"]{background:var(--me);color:var(--me-ink);font-weight:700}
nav.side .dot{font-size:11px;background:var(--gap);color:var(--gap-ink);border-radius:999px;padding:0 7px;font-weight:700}
.who{margin-top:auto;padding:10px;border-top:1px solid #33405A;font-size:13px}
.who b{display:block}
.who span{color:var(--side-muted)}

main{overflow-y:auto;min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding:28px 28px 80px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.35;font-weight:900;margin:0}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 4px;font-weight:700}
p{margin:0 0 10px;max-width:42em}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g21{grid-template-columns:2fr 1fr} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.g3,.g4{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1fr}}
@media (max-width:720px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.btn{appearance:none;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface)}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tag.y{background:var(--me);color:var(--me-ink);border-color:transparent}
.tag.b{background:var(--them);color:var(--them-ink);border-color:transparent}
.tag.p{background:var(--gap);color:var(--gap-ink);border-color:transparent}
.tag.g{background:var(--ok);color:var(--ok-ink);border-color:transparent}
textarea,input[type=text],select.f{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:11px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0;padding-top:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);border-top:0;font-weight:700;white-space:nowrap}
.err{color:var(--gap-ink);background:var(--gap);padding:7px 12px;border-radius:8px;font-size:13px;margin-top:8px}

/* 付箋 */
.sticky{padding:12px 14px;font-weight:700;box-shadow:0 6px 14px -9px rgba(20,30,50,.5)}
.sticky.y{background:var(--me);color:var(--me-ink);rotate:-1deg}
.sticky.b{background:var(--them);color:var(--them-ink);rotate:1deg}
.sticky.p{background:var(--gap);color:var(--gap-ink);rotate:-.6deg}
.sticky.g{background:var(--ok);color:var(--ok-ink);rotate:.8deg}

/* ヒーロー：今週の温度 */
.pulse{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
@media (max-width:720px){.pulse{grid-template-columns:1fr}}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--me);color:var(--me-ink);border-color:transparent}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* ギャップ */
.track{position:relative;height:58px;margin:6px 16px 0}
.track .rail{position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line)}
.track .band{position:absolute;top:23px;height:12px;background:var(--gap);opacity:.6;border-radius:6px}
.track .mk{position:absolute;width:30px;height:30px;display:grid;place-items:center;font-size:12px;font-weight:900;transform:translateX(-50%);box-shadow:0 4px 10px -6px rgba(20,30,50,.5)}
.track .mk.me{background:var(--me);color:var(--me-ink);top:0;rotate:-5deg}
.track .mk.them{background:var(--them);color:var(--them-ink);top:28px;rotate:4deg}
.gaprow{padding:10px 0;border-top:1px solid var(--line)}
.gaprow:first-child{border-top:0}

/* ステップ（評価サイクル） */
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:s}
.cycle div{padding:10px 12px;border-top:4px solid var(--line);font-size:13px}
.cycle div.done{border-color:var(--ok)}
.cycle div.now{border-color:var(--me)}
.cycle b{display:block;font-size:14px}
@media (max-width:720px){.cycle{grid-template-columns:1fr 1fr}}

/* バー */
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.bar .t{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr 40px}}

.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--them);color:var(--them-ink)}
.av.y{background:var(--me);color:var(--me-ink)} .av.g{background:var(--ok);color:var(--ok-ink)} .av.p{background:var(--gap);color:var(--gap-ink)}

.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--me);color:var(--me-ink)}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}

/* 共有設定・引き継ぎ・任期 */
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--focus);cursor:pointer;margin:0}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.handrow{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.handrow:first-of-type{border-top:0}
.handrow ul{margin:4px 0 8px;padding-left:1.2em}
@media (max-width:820px){.handrow{grid-template-columns:1fr}}
.termbig{font-size:56px;font-weight:900;line-height:1.05}
.tline{position:relative;height:44px;margin:22px 10px 6px}
.tline .rail{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.tline .done{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--me)}
.tline .ms{position:absolute;top:15px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:var(--them);border:2px solid var(--surface)}
.tline .ms.end{background:var(--gap)}
.tline .now{position:absolute;top:-6px;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.tline .now::after{content:"";position:absolute;left:50%;top:16px;height:24px;border-left:2px solid var(--ink)}
.tends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pathopt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.pathopt:first-of-type{border-top:0}
.pathopt input{margin-top:4px}
.sharetbl td,.sharetbl th{text-align:center;vertical-align:middle}
.sharetbl td:first-child,.sharetbl th:first-child{text-align:left}

/* 学内のつながり */
.mapnode{cursor:pointer}
.mapnode:focus-visible rect{stroke:var(--focus);stroke-width:3}
.mapnode.dim{opacity:.3}
svg.chart text.node{fill:var(--ink);font-size:12px;font-weight:700}
svg.chart text.sub{fill:var(--muted);font-size:10.5px}
.common{display:inline-flex;gap:4px;flex-wrap:wrap}
.common .tag{background:var(--them);color:var(--them-ink);border-color:transparent}
.from{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--me);color:var(--me-ink)}
.cluster{border-top:1px solid var(--line);padding:16px 0}
.cluster:first-of-type{border-top:0;padding-top:4px}
.dotgrid td,.dotgrid th{text-align:center;vertical-align:middle;padding:6px 4px}
.dotgrid td:first-child,.dotgrid th:first-child{text-align:left;white-space:nowrap}
.dotgrid th{font-size:11px;white-space:normal;min-width:56px}
.dot2{display:inline-block;border-radius:50%;background:var(--them);vertical-align:middle}
.flow td:first-child{white-space:nowrap;font-weight:700}

/* 聞く（エージェント） */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.today .sticky{display:block;text-decoration:none;font-weight:500;min-height:92px}
.today .sticky b{display:block;font-size:15px;margin-top:2px}
.pulsemini{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 16px;font-size:14px}
.pulsemini button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.pulsemini button[aria-pressed="true"]{background:var(--me);color:var(--me-ink);border-color:transparent}
.chat2{display:flex;flex-direction:column;gap:12px}
.chat2:empty{display:none}
.bub{max-width:86%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.7}
.bub.u{align-self:flex-end;background:var(--me);color:var(--me-ink)}
.bub.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.bub.wait{color:var(--muted)}
.xcard{align-self:stretch;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.xcard>h3{font-size:14px;margin:0 0 6px}
.askbar{display:flex;gap:8px;align-items:flex-end;margin-top:14px}
.askbar textarea{min-height:52px;flex:1}
.chat2:not(:empty)+.askbar{border-top:1px solid var(--line);padding-top:14px}
.sugg{margin-top:12px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:14px}
.featgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.feat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:transparent;cursor:pointer;font-size:13px;color:var(--muted)}
.feat b{display:block;font-size:14px;color:var(--ink)}
.feat:hover{border-color:var(--ink)}
.pcard{padding:12px 0;border-top:1px solid var(--line)}
.pcard:first-of-type{border-top:0;padding-top:2px}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 56px}
.tag.diff{background:var(--them);color:var(--them-ink);border-color:transparent}
.slotbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:6px;cursor:pointer;font-weight:700}
.slotbtn:hover{border-color:var(--ink)}
.okmsg{color:var(--ok-ink);background:var(--ok);padding:8px 12px;border-radius:8px;font-size:14px;font-weight:700}
.slack{border-left:4px solid var(--them);padding-left:10px}
.slack textarea{min-height:96px;margin:6px 0}
.mtg{padding:14px 0;border-top:1px solid var(--line)}
.mtg:first-of-type{border-top:0;padding-top:4px}
.mtg ul{margin:6px 0 0;padding-left:1.2em}
.xgrid td{text-align:center;font-weight:700;font-size:13px}
.xgrid td:first-child,.xgrid th:first-child{text-align:left}
@media (max-width:640px){.today{grid-template-columns:1fr}.today .sticky{min-height:0}.pacts{margin-left:0}.bub{max-width:94%}.askbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);padding-bottom:6px}}

.promise{border-left:4px solid var(--ok);padding:12px 16px;margin-bottom:16px}
.promise ul{margin:6px 0 0;padding-left:1.2em}
.promise li{margin:2px 0}
.reqbox{border-left:4px solid var(--me);padding:12px 16px;margin-bottom:16px}

/* 学びの記録 */
.lentry{padding:14px 0;border-top:1px solid var(--line)}
.lentry:first-of-type{border-top:0;padding-top:4px}
.needbox{background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:8px}
.needbox .tag{background:var(--ok);color:var(--ok-ink);border-color:transparent;margin-right:4px}
.needbox>div{margin-top:4px}
.lacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.lacts select{width:auto;padding:5px 8px;font-size:13px}
.needrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 70px 1fr 64px minmax(150px,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.needrow:first-of-type{border-top:0}
.needrow .t{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.needrow .t i{display:block;height:100%;border-radius:6px;background:var(--them)}
.lv{letter-spacing:2px;color:var(--gap-ink);font-weight:900}
@media (max-width:820px){.needrow{grid-template-columns:1fr 1fr}.needrow>:first-child{grid-column:1/-1}.needrow .t{grid-column:1/-1}}

/* ロールモデル */
.exps{list-style:none;padding:0;margin:6px 0}
.exps li{font-size:13.5px;margin:4px 0}
.exps .tag{margin-right:6px}
.rmforms{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:720px){.rmforms{grid-template-columns:1fr}}

.lcat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
.lcat:first-child{border-top:0}
.lcat .t{grid-column:1 / -1}
.line100 span{white-space:nowrap}
.stackrow .line100 span{display:none}
.stackrow + .stackrow .line100 span{display:block}
.lcat select{width:auto;padding:3px 6px;font-size:13px}
.lcat .t{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative}
.lcat .t i{display:block;height:100%;border-radius:5px}

/* キャリアとライフ */
.lifesec .chips{margin:10px 0}
.scope{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.scope label{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.scope label.pub{font-weight:700}
.preview .tag{margin:2px 4px 2px 0}

/* 登録と管理 */
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form2 label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
@media (max-width:640px){.form2{grid-template-columns:1fr}}
.rolepick{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rolepick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.rolepick label:has(input:checked){border-color:var(--ink);background:var(--bg)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.who a{color:var(--side-muted);font-size:12px}
.utable select{width:auto;padding:4px 8px;font-size:13px}
.stat{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px}
.stat.ok{background:var(--ok);color:var(--ok-ink)} .stat.wait{background:var(--me);color:var(--me-ink)} .stat.stop{background:var(--line);color:var(--ink)}
.livebar{font-size:12px;padding:6px 10px;border-radius:8px;background:#2A3550;color:var(--side-ink);margin:0 4px}

/* 右上の新規登録・ログイン */
.authbar{max-width:1040px;margin:0 auto;padding:14px 28px 0;display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.authbar:empty{display:none}
.authbar .btn{text-decoration:none;display:inline-flex;align-items:center}
.authbar .me{font-size:13px;color:var(--muted)}

  const raw = location.hash.replace(/^#/,"");
  if (!AUTHED && raw && !["login","register"].includes(raw)) PENDING_HASH = raw;
  let v = raw || ROLE_HOME[role];
  document.body.classList.toggle("locked", !AUTHED);
  if (!AUTHED){ if (v!=="register" && v!=="about") v = "login"; renderAuth(); VIEWS[v](); $("#main").scrollTop = 0; window.scrollTo(0,0); return; }
  if (LIVE && !ME && v!=="register"){ history.replaceState(null, "", "#register"); v = "register"; }
  if (ME && v!=="profile" && v!=="register" && !(v==="users" && SYSADMIN) && myStatus()!=="approved"){ v = "pending"; }
  if (v==="users" && !SYSADMIN) v = ROLE_HOME[role];
  if (SPECIAL.includes(v)){ renderNav(v); VIEWS[v](); afterRoute(); return; }
  if (LOCKED() && (v.startsWith("member-") ? role!=="manager" : !inRole(role, v))) v = ROLE_HOME[role];
  const mem = v.startsWith("member-") ? S.team.find(m => "member-" + m.id === v) : null;
  if (mem && !LOCKED()){ role = "manager"; $("#role").value = role; }
  if (mem && role==="manager"){ renderNav("team"); VIEWS.member(mem); afterRoute(); return; }
  if (v!=="ask" && !VIEW_ROLE[v]) v = ROLE_HOME[role];
  if (!inRole(role, v)){ const r = VIEW_ROLE[v] || (v==="ask" ? "staff" : null); if (r && (r!=="sysadmin" || SYSADMIN)){ role = r; $("#role").value = role; } else v = ROLE_HOME[role]; }

  afterRoute();
}

function labelTables(){
  app.querySelectorAll("table").forEach(t => {
    if (t.classList.contains("heat")) return;
    const hs = [...t.querySelectorAll("thead th")].map(th => [...th.childNodes].map(n => n.textContent).join(" ").replace(/\s+/g," ").trim());
    if (!hs.length) return;
    t.classList.add("rtable");
    t.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => { if (td.dataset.label === undefined) td.dataset.label = hs[i] || ""; }));
  });
}

function trackHTML(it, meLabel="本", themLabel="相"){
  const d = Math.abs(it.me-it.them), lo = Math.min(it.me,it.them), hi = Math.max(it.me,it.them);
  const tag = d>=2 ? `<span class="tag p">ズレあり</span>` : d===1 ? `<span class="tag">ほぼ近い</span>` : `<span class="tag g">一致</span>`;
  return `<div class="gaprow"><div class="between"><h3>${esc(it.label)}</h3>${tag}</div>
    <div class="track" role="img" aria-label="${esc(it.label)}：本人${it.me}、上司${it.them}"><div class="rail"></div>
    ${d?`<div class="band" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>`:""}
    <div class="mk me" style="left:${pos(it.me)}">${meLabel}</div><div class="mk them" style="left:${pos(it.them)}">${themLabel}</div></div>
    <div class="ends" style="margin:0 2px"><span>${esc(it.lo)}</span><span>${esc(it.hi)}</span></div></div>`;
}

/* --- 共通：人の検索・日程調整・Slack の下書き --- */
const DAYS = ["日","月","火","水","木","金","土"];
const hashS = t => [...t].reduce((a,c) => (a*31 + c.charCodeAt(0)) >>> 0, 7);
const fmtH = h => `${Math.floor(h)}:${h%1 ? "30" : "00"}`;
const senderName = () => role==="staff" ? S.me.name : role==="manager" ? S.boss.name : "人事課 FD/SD担当";
const findPerson = name => S.campus.find(c => c.name===name || c.name.replace(" ","")===String(name).replace(/\s/g,"") || (String(name).length>=2 && c.name.startsWith(String(name))));
function slotsFor(names, minutes=30){
  const out = [], others = names.filter(n => n !== senderName());
  for (let k = 2; out.length < 3 && k < 20; k++){
    const d = new Date(TODAY); d.setDate(TODAY.getDate()+k); const wd = d.getDay(); if (wd===0 || wd===6) continue;
    for (const h of [10, 13, 15, 16.5]){
      const busy = [senderName(), ...others].some(n => hashS(n + d.getDate() + h) % 3 === 0);
      if (!busy){ out.push(`${d.getMonth()+1}月${d.getDate()}日（${DAYS[wd]}）${fmtH(h)}〜${fmtH(h + minutes/60)}`); break; }
    }
  }
  return out;
}
function searchPeople(topic="", prefer=[], researchOnly=false){
  const base = S.myProfile, tt = tagsFor(topic), q = String(topic);
  const res = S.campus.map(c => {
    const common = c.tags.filter(t => tt.includes(t)), hit = c.keys.filter(k => q.includes(k));
    const fieldHit = q.includes(c.field) || q.includes(c.dept.replace(/（.*）/,"")) || q.includes(c.campus.replace("キャンパス",""));
    let sc = common.length*3 + hit.length*3 + (fieldHit?2:0);
    const diffs = []; if (c.campus!==base.campus) diffs.push("campus"); if (c.field!==base.field) diffs.push("field"); if (!c.job.startsWith(base.job) || c.job!==base.job) diffs.push("job");
    const topical = sc > 0;
    prefer.forEach(p => { if (diffs.includes(p)) sc += 2; });
    if (researchOnly && c.research) sc += 3;
    const why = [common.length ? "共通テーマ：" + common.join("・") : "", hit.length ? "「" + hit.join("」「") + "」に関わる" : ""].filter(Boolean).join("／");
    return {c, sc, why, diffs, topical};
  }).filter(x => (x.topical || (!tt.length && !q.trim())) && (!researchOnly || x.c.research || x.c.keys.includes("共同研究"))).sort((a,b) => b.sc - a.sc);
  return res.slice(0, 5);
}

function renderCard(k){
  if (!k) return "";
  if (k.type==="people") return `<div class="xcard" data-card="${k.id}"><h3>${esc(k.title||"候補の人")}</h3>${k.items.length ? k.items.map(it => personHTML(S.campus.find(c=>c.id===it.id), k.id, it.why)).join("") : `<p class="small muted" style="margin:0">条件に合う人が見つかりませんでした。</p>`}</div>`;
  if (k.type==="slots") return `<div class="xcard" data-card="${k.id}"><h3>${esc(k.title)}（${k.minutes}分・${esc(k.where)}）</h3>
    ${k.booked===undefined ? `${k.slots.map((sl,i) => `<button class="slotbtn" data-x="slot|${k.id}|${i}"><span>${sl}</span><span class="small muted">この時間で招待</span></button>`).join("")}
      <p class="small muted" style="margin:8px 0 0">${S.calendarOptIn ? "全員のカレンダーの空き時間から選んでいます（デモ）。" : "カレンダー連携がオフのため、あなたの予定だけで選んでいます。"}</p>`
    : `<div class="okmsg">${k.confirmed ? "確定しました" : "招待を送りました"}：${k.slots[k.booked]}</div>
      <p class="small" style="margin:8px 0 0">${k.confirmed ? `${esc(k.names.join("、"))}さんが承諾しました。カレンダーに登録し、Slackで議題の下書きを共有しています。<a href="#meetings">予定を見る</a>` : "カレンダーの招待とSlackのお知らせを送りました。相手の返事を待っています…"}</p>`}</div>`;
  if (k.type==="slack") return `<div class="xcard slack" data-card="${k.id}"><h3>Slack：${esc(k.to)}${k.to.startsWith("#")?"":" さんへ"}</h3>
    ${k.sent ? `<p class="small" style="margin:0 0 6px">${esc(k.text)}</p><div class="okmsg">送信しました（デモ）</div>`
      : `<textarea data-cardtext="${k.id}" aria-label="送る文面">${esc(k.text)}</textarea><div class="row"><button class="btn sm" data-x="send|${k.id}">Slackで送る</button><span class="small muted">送る前に自由に直せます</span></div>`}</div>`;
  if (k.type==="open") return `<div class="xcard" data-card="${k.id}"><div class="between"><span><b>${esc(k.label)}</b><br><span class="small muted">${esc(k.desc)}</span></span><a class="btn sm" href="#${k.view}" style="text-decoration:none">開く</a></div></div>`;
  if (k.type==="learning"){ const e = S.learnings.find(x=>x.id===k.lid); return `<div class="xcard" data-card="${k.id}"><h3>${role==="staff" ? "わたしの学び" : "学びの記録"}に追加しました（${e.share}）</h3>${learnHTML(e, true, true)}<a class="small" href="#selflearn">${role==="staff" ? "わたしの学び" : "学びの記録"}を開く</a></div>`; }
  if (k.type==="peers") return `<div class="xcard" data-card="${k.id}"><h3>同じような状況の人</h3>${peersSection(k.id)}<p class="small muted" style="margin:8px 0 0">お互いに学内に公開している項目だけで探しています。</p></div>`;
  if (k.type==="rm") return `<div class="xcard" data-card="${k.id}"><h3>経験を相談できる人</h3>${k.ids.length ? k.ids.map(id => rmHTML(getRM(id), k.id)).join("") : `<p class="small muted" style="margin:0">近い経験の人が見つかりませんでした。「つながり」から登録者の一覧を見られます。</p>`}<p class="small muted" style="margin:8px 0 0">相談したことは、上司や人事には共有されません。</p></div>`;
  if (k.type==="signals") return `<div class="xcard" data-card="${k.id}">${crossHTML()}</div>`;
  return "";
}
const refreshCard = id => document.querySelectorAll(`[data-card="${id}"]`).forEach(el => { el.outerHTML = renderCard(CARDS[id]); });
function slotCard(names, minutes=30, title, inPerson){
  const ps = names.map(findPerson).filter(Boolean);
  const far = ps.some(p => p.campus !== S.myProfile.campus);
  const where = inPerson ? (far ? `${ps[0].campus}（移動を含めて調整）` : "本部キャンパス 交流ラウンジ") : "オンライン（Teams）";
  return newCard({type:"slots", names, minutes, title: title || `${names.join("、")}さんとの打ち合わせ`, where, slots: slotsFor(names, minutes)});
}
function dmCard(c){
  const mine = projectsOf(S.team.find(m=>m.id==="sato"));
  const link = mine.find(p => p.tags.some(t => c.tags.includes(t)));
  const text = role==="staff"
    ? `${c.name}さん、はじめまして。医学教育センターの${S.me.name}です。${c.project}の取り組みを拝見しました。私も「${link ? link.name : "臨床教育"}」に取り組んでいて、重なるところがありそうです。30分ほどオンラインでお話を伺えませんか。`
    : role==="manager" ? `${c.name}さん、医学教育センター長の${S.boss.name}です。${c.project}について、センターのメンバーとつないでいただけないかと思いご連絡しました。少しお時間をいただけますか。`
    : `${c.name}さん、人事課FD/SD担当です。${c.project}の取り組みを、来年度の合同FD/SD研修で紹介していただけないかと考えています。一度ご相談させてください。`;
  return newCard({type:"slack", to:c.name, text});
}
function book(k, i){
  k.booked = i; const m = {id:"m"+Date.now(), owner:role, title:k.title, with:k.names, label:k.slots[i], where:k.where, st:"招待中", agenda:[]};
  S.meetings.unshift(m); refreshCard(k.id);
  setTimeout(() => { k.confirmed = true; m.st = "確定"; refreshCard(k.id); if (location.hash==="#meetings") VIEWS.meetings(); }, 1800);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-x]"); if (!t) return;
  const [act, a, b] = t.dataset.x.split("|");
  if (act==="sched" || act==="dm"){
    const c = S.campus.find(x => x.id===b), key = a + ":" + b;
    const k = act==="sched" ? slotCard([c.name], 30, `${c.name}さんとの打ち合わせ`) : dmCard(c);
    SUBS[key] = k.id; const el = document.querySelector(`[data-sub="${key}"]`); if (el) el.innerHTML = renderCard(k);
  }
  if (act==="slot"){ const k = CARDS[a]; if (k && k.booked===undefined) book(k, +b); }
  if (act==="send"){ const k = CARDS[a]; if (k){ k.sent = true; refreshCard(a);
    if (k.kind==="request" && !S.requests.some(r => r.from===S.me.name)){ S.requests.push({from:S.me.name, text:k.text, date:"今日"}); const rb = $("#req"); if (rb){ rb.textContent = "センター長に相談を送りました"; rb.disabled = true; } } } }
  if (act==="schedn"){ const k = slotCard([a], 30, b || undefined); const el = t.closest(".reqbox")?.querySelector(".reqout"); if (el) el.innerHTML = renderCard(k); }
  if (act==="ask"){ if (location.hash!=="#ask") location.hash = "ask"; setTimeout(() => askAgent(a), 60); }
});
document.addEventListener("input", e => { const id = e.target.dataset && e.target.dataset.cardtext; if (id && CARDS[id]) CARDS[id].text = e.target.value; });

    <tbody>${x.campuses.map((c,i)=>`<tr><td><b>${c}</b></td>${x.m[i].map((v,j)=>`<td style="background:${i===j?"transparent":`color-mix(in srgb, var(--them) ${Math.round(v/max*85)}%, transparent)`}">${i===j?"—":v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>

  if (role==="admin") T.push({name:"get_collaboration_signals", description:"Slackの公開チャンネルから集計した、キャンパス間のやりとりの量と、キャンパスをまたぐ話題を返し、表を画面に表示する。",

function localAnswer(text, msg){
  const add = k => msg.cards.push(k.id);
  const p = S.campus.find(c => text.includes(c.name.split(" ")[0])) || [...S.team, {name:"田中 誠"}, {name:"清水 和夫"}].find(m => text.includes(m.name.split(" ")[0]));
  const fmap = [[/働き方|エフォート|負荷|時間の使い方|成長の時間/,"workstyle"],[/学び|自己研修|勉強|リカレント|読んだ|講座/,"selflearn"],[/学び|自己研修|リカレント|学内講師/,"learnmap"],[/任期|キャリア/,"career"],[/成果|ログ/,"log"],[/ありがとう|お礼/,"thanks"],[/共有|Slack連携|プライバシー/,"sharing"],[/期待|すり合わせ|目標/,"goals"],[/研修|FD|SD/,"learn"],[/相談/,"coach"],[/強み|学外/,"network"],[/面談の準備/,"prep"],[/引き継ぎ/,"handover"],[/チーム/,"team"],[/面談記録/,"records"],[/叩き台|取り組みマップ|グループ/,"clusters"],[/交代/,"transitions"],[/提案|打ち手|戦略/,"proposals"],[/分析/,"insights"],[/導入|設定/,"cycle-settings"]];

async function askAgent(text){
  text = String(text||"").trim(); if (!text || agentBusy) return;
  const chat = chats[role]; chat.push({role:"user", content:text});
  const msg = {role:"assistant", content:"", cards:[]}; chat.push(msg); drawChat();
  if (toolsOK===null && sample) toolsOK = !!((await sample.limits().catch(()=>null))||{}).tools;
  if (!sample || !toolsOK){ localAnswer(text, msg); drawChat(); return; }
  agentBusy = true; agentCtl = new AbortController(); drawChat();
  const summary = m => m.cards.map(id => { const k = CARDS[id]; return k.type==="people" ? "候補："+k.items.map(i=>S.campus.find(c=>c.id===i.id).name).join("、") : k.type==="slots" ? "日程候補："+k.names.join("、")+(k.booked!==undefined?"（"+k.slots[k.booked]+"で招待済み）":"") : k.type==="slack" ? "Slack下書き："+k.to+(k.sent?"（送信済み）":"") : k.type==="open" ? "画面："+k.label : "表"; }).join("／");
  const hist = chat.slice(0,-1).slice(-10).map(m => ({role:m.role, content: m.role==="assistant" ? ((m.content||"") + (m.cards.length ? `\n［表示したカード：${summary(m)}］` : "")).trim() || "（カードを表示しました）" : m.content}));
  if (hist[0] && hist[0].role==="assistant") hist.shift();
  try {
    const r = await sample([{role:"user", content:contextPrompt() + "\n\n会話を始めます。"}, {role:"assistant", content:"承知しました。"}, ...hist],
      {tools: buildTools(msg), cache:false, signal:agentCtl.signal, onText:({text}) => { msg.content = text; drawChat(true); }});
    msg.content = r.text;
  } catch(e){
    if (e && e.code==="tools_unavailable"){ toolsOK = false; localAnswer(text, msg); }
    else if (!(e && e.code==="cancelled")){ msg.content = (e && e.text) || ""; msg.error = e && e.code==="rate_limited" ? "混み合っています。少し待ってから、もう一度送ってください。" : e && e.code==="not_granted" ? "AIの利用が許可されていないため、簡易の案内で答えます。" : "うまく答えられませんでした。もう一度送ってください。";
      if (e && e.code==="not_granted"){ sample = null; msg.error = ""; localAnswer(text, msg); } }
  }
  agentBusy = false; drawChat();
}
function drawChat(streaming){

const NEED2CAT = {医工連携:"研究", "評価・アセスメント":"教育", 臨床教育:"教育", 多職種連携教育:"教育", 新任者支援:"教育", 外部資金:"研究", マネジメント:"管理運営", 業務改善:"管理運営", 心身の支え:"管理運営"};
function guessCat(title, note=""){
  const t = title + " " + note;
  if (/診療|外来|手技|症例|臨床推論|当直|救急対応/.test(t)) return "臨床";
  if (/論文|研究|学会発表|科研|研究費|先行研究/.test(t)) return "研究";
  if (/地域|公開講座|社会|高校|自治体|市民/.test(t)) return "社会貢献";
  const n = needsFor({title, note}); if (n.length) return NEED2CAT[n[0]] || "教育";
  return "教育";
}
const weekStart = (() => { const d = new Date(TODAY); d.setDate(d.getDate() - ((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; })();
const inWeek = e => { if (e.date==="今日") return true; const m = String(e.date).match(/(\d+)月(\d+)日/); return !!m && new Date(TODAY.getFullYear(), +m[1]-1, +m[2]) >= weekStart; };
const catOf = e => e.cat || guessCat(e.title, e.note);
function growthByCat(){ const o = {}; LCATS.forEach(c => o[c] = 0); S.learnings.filter(e => e.who===S.me.name && inWeek(e)).forEach(e => { o[catOf(e)] = (o[catOf(e)]||0) + e.minutes/60; }); return o; }
const growthWeek = () => Math.round(Object.values(growthByCat()).reduce((a,b)=>a+b,0)*10)/10;
const growthTarget = () => Object.values(S.growth.plan).reduce((a,b)=>a+b,0);
function addLearning(o){

  S.learnings.unshift(e); return e;
}

const RMCAT = {キャリア:"b", ライフイベント:"p", 業務:"y", 研究:"g"};

function rmFit(r){
  if (role!=="staff") return [];
  const t = r.exps.map(e => e.text).join(" "), why = [];
  if (S.term.type==="任期付き" && /任期|無期|公募/.test(t)) why.push("任期付きからの道のり");
  if (/センター/.test(t)) why.push("センター教員の経験");
  if (/両立|研究時間|時間を分けた|時間をつくる/.test(t)) why.push("業務と研究の時間のやりくり");
  if (S.life.life.scope!=="使わない" && S.life.life.items.some(it => (LIFE2KEY[it]||[]).some(k => t.includes(k)))) why.push("あなたが記入したライフプランに近い経験");
  return why;
}

function rmList(cat, topic){
  const q = String(topic||""), words = q.split(/[、・\s]/).filter(w => w.length >= 2);
  const hits = r => words.filter(w => r.exps.some(e => e.text.includes(w))).length;
  return S.mentors.map(m => getRM(m.cid)).filter(r => (!cat || cat==="すべて" || r.exps.some(e => e.cat===cat)) && (!words.length || hits(r) > 0))
    .sort((a,b) => hits(b) - hits(a) || rmFit(b).length - rmFit(a).length || b.rec - a.rec);
}

function matchesFor(m){
  const ps = projectsOf(m);
  return S.campus.filter(c => c.name !== m.name).map(c => {
    const links = ps.map(p => ({p, common: p.tags.filter(t => c.tags.includes(t))})).filter(l => l.common.length);
    return {c, links, score: links.reduce((a,l) => a + l.common.length, 0)};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);

const AVC = ["y","b","g","p","c"];

function campusMapSVG(projs, ms){
  const W = 660, L = 230, R = 430, n = Math.max(projs.length, ms.length), H = n*52 + 24;
  const ly = i => 24 + (projs.length===1 ? (H-48)/2 : i*(H-48)/(projs.length-1));
  const ry = i => 24 + (ms.length===1 ? (H-48)/2 : i*(H-48)/(ms.length-1));
  const cut = (t,k) => t.length > k ? t.slice(0,k) + "…" : t;
  const lines = ms.flatMap((m,j) => m.links.map(l => { const i = projs.findIndex(p => p.name===l.p.name); const y1 = ly(i), y2 = ry(j);
    return `<path data-l="${i}" d="M${L} ${y1} C${(L+R)/2} ${y1}, ${(L+R)/2} ${y2}, ${R} ${y2}" fill="none" stroke="var(--them)" stroke-width="${1+l.common.length*1.6}" stroke-opacity=".7"/>`; })).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="あなたの取り組みと、似た取り組みをしている学内の人のつながり">
    ${lines}
    ${projs.map((p,i)=>`<g class="mapnode" data-proj="${i}" tabindex="0" role="button" aria-label="${esc(p.name)}で絞り込む"><rect x="0" y="${ly(i)-18}" width="${L}" height="36" rx="6" fill="var(--me)"/><text class="node" x="10" y="${ly(i)+4}" style="fill:var(--me-ink)">${esc(cut(p.name,17))}</text></g>`).join("")}
    ${ms.map((m,j)=>`<g><rect x="${R}" y="${ry(j)-20}" width="${W-R}" height="40" rx="6" fill="var(--surface)" stroke="var(--line)"/><text class="node" x="${R+10}" y="${ry(j)-3}">${esc(m.c.name)}</text><text class="sub" x="${R+10}" y="${ry(j)+12}">${esc(cut(m.c.dept+"・"+m.c.project,19))}</text></g>`).join("")}
  </svg>`;
}

function clusterList(){
  const people = [...S.campus.map(c => ({name:c.name, dept:c.dept, title:c.title, project:c.project, tags:c.tags})),
    ...S.team.flatMap(m => projectsOf(m).map(p => ({name:m.name, dept:"医学教育センター", title:m.title, project:p.name, tags:p.tags})))];
  return Object.keys(CL).map(tag => {
    const ps = people.filter(p => p.tags.includes(tag));
    const byName = {}; ps.forEach(p => (byName[p.name] ||= {...p, projects:[]}).projects.push(p.project));
    const members = Object.values(byName), depts = [...new Set(members.map(m => m.dept))];
    return {tag, ...CL[tag], members, depts};
  }).filter(c => c.members.length >= 3 && c.depts.length >= 2).sort((a,b) => b.members.length - a.members.length || b.depts.length - a.depts.length);
}

/* --- 上司：メンバー詳細（担当業務とエフォート） --- */
const CATS = ["教育","研究","社会貢献","管理運営","臨床"];
const CATC = {教育:["--me","--me-ink","y"], 研究:["--them","--them-ink","b"], 社会貢献:["--ok","--ok-ink","g"], 管理運営:["--gap","--gap-ink","p"], 臨床:["--clin","--clin-ink","c"]};
const actualEff = m => { const a = {}; CATS.forEach(c => a[c] = 0); m.tasks.forEach(t => a[t.cat] += t.eff); return a; };
const totalLoad = m => m.tasks.reduce((s,t) => s + t.eff, 0);
const maxDev = m => { const a = actualEff(m); return CATS.reduce((mx,c) => { const d = a[c] - (m.plan[c]||0); return Math.abs(d) > Math.abs(mx.d) ? {c,d} : mx; }, {c:"", d:0}); };
const loadTag = m => { const L = totalLoad(m); return L > 100 ? `<span class="tag p">${L}%・見直しどき</span>` : L >= 95 ? `<span class="tag">${L}%</span>` : `<span class="tag g">${L}%</span>`; };
const devTag = m => { const {c,d} = maxDev(m); return Math.abs(d) >= 10 ? `<span class="tag ${CATC[c][2]}">${c} ${d>0?"+":""}${d}pt</span>` : `<span class="small muted">小さい</span>`; };
const stTag = s => s==="要注意" ? `<span class="tag p">要注意</span>` : s==="遅れ気味" ? `<span class="tag y">遅れ気味</span>` : s==="順調" ? `<span class="tag g">順調</span>` : `<span class="tag">${s}</span>`;

function lineSVG(){
  const o = S.org, W=600, H=280, L=40, R=130, T=16, B=30, n=o.months.length;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (1-(v-2.5)/2)*(H-T-B);

}

/* 小さなポップアップ（ブラウザの alert は表示されない環境があるため、自前で出す） */
function popup(title, body, returnTo){
  const wrap = document.createElement("div"); wrap.className = "popwrap";
  wrap.innerHTML = `<div class="pop" role="dialog" aria-modal="true" aria-labelledby="pop-t"><p id="pop-t" class="pop-t">${esc(title)}</p>${body ? `<p class="small muted" style="margin:0 0 16px">${esc(body)}</p>` : ""}<button class="btn" type="button">OK</button></div>`;
  const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); returnTo && returnTo.focus(); };
  const onKey = e => { if (e.key==="Escape" || e.key==="Enter"){ e.preventDefault(); close(); } };
  wrap.addEventListener("click", e => { if (e.target===wrap || e.target.closest("button")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.append(wrap); wrap.querySelector("button").focus();
}

    if (user) uid = await user.id();
  }
  LIVE = !!(db && uid);
  if (!LIVE){ demoMembers(); SYSADMIN = true; route(); return; }
  try {
    SYSADMIN = (await user.isOwner()) || (await user.canEdit());
    const [st, me] = await Promise.all([db.doc("settings/main").get(), user.me()]);
    if (st.exists) REG.settings = {...REG.settings, ...st.data()}; else if (SYSADMIN) await db.doc("settings/main").set(REG.settings).catch(()=>{});
    REG.prefillName = me && me.name || "";
    const first = await Promise.all([db.collection("members").get(), db.collection("roles").get()]);
    first[0].docs.forEach(d => REG.members[d.id] = d.data()); first[1].docs.forEach(d => REG.roles[d.id] = d.data());
    if (await user.isOwner() && !(REG.roles[uid]||{}).role){ await store.setRole(uid, {role:"admin", status:"approved"}).catch(()=>{}); }
    if (SYSADMIN){ const a = await db.collection("audit").orderBy("at","desc").limit(20).get().catch(()=>null); if (a) REG.audit = a.docs.map(d=>d.data()); }
    ME = REG.members[uid] || null; applyIdentity();
    db.collection("members").onSnapshot(sn => { REG.members = {}; sn.docs.forEach(d => REG.members[d.id] = d.data()); ME = REG.members[uid] || null; applyIdentity(); if (["users"].includes(location.hash.slice(1))) VIEWS.users(); renderNav(location.hash.slice(1)); }, ()=>{});
    db.collection("roles").onSnapshot(sn => { const before = myStatus(); REG.roles = {}; sn.docs.forEach(d => REG.roles[d.id] = d.data()); applyIdentity(); if (before!==myStatus()) route(); else renderNav(location.hash.slice(1)); }, ()=>{});
  } catch(e){ /* 読み込めないときはデモとして表示 */ LIVE = false; demoMembers(); SYSADMIN = true; }
  route();
}
init();
})();
</script>
</body>
</html>
