<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すりあわせ｜期待のズレと見えない成果を、ひとりで抱えない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1E2940; --muted:#5E6A80; --line:#D7DDE6;
  --me:#F6DF5E; --me-ink:#4A3F00; --them:#9CBDF2; --them-ink:#12305E;
  --gap:#E7A3D6; --gap-ink:#5A1748; --ok:#B9DB97; --ok-ink:#25430C;
  --focus:#2F5BD3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A26; --surface:#1D2534; --ink:#E7ECF4; --muted:#A3AEC2; --line:#323D51;
    --me:#E3CB45; --me-ink:#2D2600; --them:#7FA6E6; --them-ink:#0B1F40;
    --gap:#D584C3; --gap-ink:#3A0B2E; --ok:#9CC678; --ok-ink:#16290A;
    --focus:#8DB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A26; --surface:#1D2534; --ink:#E7ECF4; --muted:#A3AEC2; --line:#323D51;
  --me:#E3CB45; --me-ink:#2D2600; --them:#7FA6E6; --them-ink:#0B1F40;
  --gap:#D584C3; --gap-ink:#3A0B2E; --ok:#9CC678; --ok-ink:#16290A;
  --focus:#8DB0FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-block;width:14px;height:14px;background:var(--me);transform:rotate(-6deg)}
.brand i+i{background:var(--them);transform:rotate(5deg);margin-left:-8px}
nav.tabs{display:flex;gap:4px}
nav.tabs a{padding:6px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}

main{max-width:820px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.35;font-weight:900;margin:8px 0 12px;letter-spacing:.01em}
h2{font-size:21px;line-height:1.45;margin:0 0 6px;font-weight:700}
h3{font-size:17px;margin:0 0 4px;font-weight:700}
p{margin:0 0 12px;max-width:40em}
.lead{color:var(--muted);font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:12px 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin:20px 0}
label.f{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface)}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* hero sticky pair */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.pair{position:relative;width:170px;height:150px}
.sticky{position:absolute;width:112px;height:112px;padding:12px;font-size:13px;line-height:1.5;font-weight:700;box-shadow:0 6px 14px -8px rgba(20,30,50,.45)}
.sticky.a{background:var(--me);color:var(--me-ink);left:0;top:0;transform:rotate(-5deg)}
.sticky.b{background:var(--them);color:var(--them-ink);left:56px;top:34px;transform:rotate(4deg)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.pair{display:none}}

.list{list-style:none;padding:0;margin:0}
.list li{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.list li:first-child{border-top:0}
.list a{color:var(--ink);font-weight:700;text-decoration:none}
.list a:hover{text-decoration:underline}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.badge.wait{background:var(--line);color:var(--ink)}
.badge.done{background:var(--ok);color:var(--ok-ink)}

/* questions */
.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 0;font-weight:700;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--me);color:var(--me-ink);border-color:transparent}
.role-them .scale button[aria-pressed="true"]{background:var(--them);color:var(--them-ink)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}

.status{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.who{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.who i{width:14px;height:14px;display:inline-block}
.who.me i{background:var(--me)} .who.them i{background:var(--them)}

/* gap tracks: the signature element */
.track-wrap{padding:18px 0;border-top:1px solid var(--line)}
.track-wrap:first-child{border-top:0}
.track-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{position:relative;height:64px;margin:10px 18px 2px}
.track .rail{position:absolute;left:0;right:0;top:31px;height:2px;background:var(--line)}
.track .tick{position:absolute;top:25px;width:2px;height:14px;background:var(--line);transform:translateX(-1px)}
.track .band{position:absolute;top:26px;height:12px;background:var(--gap);opacity:.55;border-radius:6px}
.track .mk{position:absolute;width:34px;height:34px;display:grid;place-items:center;font-size:13px;font-weight:900;transform:translateX(-50%);box-shadow:0 4px 10px -6px rgba(20,30,50,.5);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.track .mk.me{background:var(--me);color:var(--me-ink);top:0;rotate:-5deg}
.track .mk.them{background:var(--them);color:var(--them-ink);top:30px;rotate:4deg}
.verdict{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.verdict.big{background:var(--gap);color:var(--gap-ink)}
.verdict.near{background:var(--line);color:var(--ink)}
.verdict.same{background:var(--ok);color:var(--ok-ink)}
@media (prefers-reduced-motion:reduce){.track .mk{transition:none}}

.quotes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.quote{padding:14px;font-size:15px;min-height:90px}
.quote.me{background:var(--me);color:var(--me-ink);transform:rotate(-.6deg)}
.quote.them{background:var(--them);color:var(--them-ink);transform:rotate(.6deg)}
.quote b{display:block;font-size:12px;margin-bottom:4px}
@media (max-width:560px){.quotes{grid-template-columns:1fr}}

.ai{white-space:normal}
.ai ol{padding-left:1.4em;margin:8px 0}
.ai li{margin:8px 0}

/* log */
.logs h3{margin-top:22px;font-size:15px;color:var(--muted)}
.log-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.kind{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}
.del:hover{color:var(--ink);text-decoration:underline}
.sheet{background:var(--bg);border-radius:10px;padding:16px;margin-top:12px}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet th,.sheet td{text-align:left;vertical-align:top;padding:8px 6px;border-top:1px solid var(--line)}
.sheet th{font-size:13px;color:var(--muted);font-weight:700;border-top:0}
.scroll{overflow-x:auto}
.err{color:var(--gap-ink);background:var(--gap);padding:8px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.demo{background:var(--me);color:var(--me-ink);font-size:13px;padding:6px 12px;text-align:center}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>お試しモード：保存されず、ページを閉じると消えます。本人と相手の両方をこの画面で試せます。</div>
<header class="top"><div class="top-inner">
  <div class="brand"><i></i><i></i>すりあわせ</div>
  <nav class="tabs" aria-label="機能">
    <a href="#" id="tabGap">期待のすり合わせ</a>
    <a href="#log" id="tabLog">成果ログ</a>
  </nav>
</div></header>
<main id="app" aria-live="polite"><p class="muted">読み込んでいます…</p></main>

<script>
(() => {
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");

/* ---------- 質問定義 ---------- */
const QS = [
  {id:"research", label:"研究の成果（論文・外部資金）", lo:"ほとんど求めない", hi:"強く求める"},
  {id:"teaching", label:"教育・学生支援", lo:"ほとんど求めない", hi:"強く求める"},
  {id:"admin", label:"学内の運営・委員会業務", lo:"ほとんど求めない", hi:"強く求める"},
  {id:"outreach", label:"学外連携・社会貢献", lo:"ほとんど求めない", hi:"強く求める"},
  {id:"pace", label:"成果を出すまでの時間軸", lo:"数年かけてよい", hi:"今年度中に", custom:true},
  {id:"solo", label:"仕事の進め方", lo:"周りと分担して", hi:"ひとりで完結して", custom:true},
];
const askText = (q, role) => {
  if (q.id === "pace") return role === "self" ? "どのくらい早く成果を求められていると思いますか？" : "どのくらい早く成果を求めていますか？";
  if (q.id === "solo") return role === "self" ? "ひとりで成果を出すことを求められていると思いますか？" : "ひとりで成果を出すことを求めていますか？";
  return role === "self" ? "どのくらい求められていると思いますか？" : "どのくらい求めていますか？";
};
const KINDS = ["教育","研究","運営","学外連携","人の支援","その他"];

/* ---------- ストア（db があれば共有・保存、なければお試し） ---------- */
let db = null, user = null, uid = null, sample = null, DEMO = false;
const mem = { checks:{}, answers:{}, logs:{}, subs:new Set() };
const memEmit = () => mem.subs.forEach(f => f());
const memSub = f => { mem.subs.add(f); f(); return () => mem.subs.delete(f); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const store = {
  async createCheck(d){
    const id = newId();
    const body = {...d, ownerUid: uid || "demo", createdAt: new Date().toISOString()};
    if (DEMO){ mem.checks[id] = body; memEmit(); return id; }
    await db.doc("checks/" + id).set(body); return id;
  },
  watchMyChecks(cb, onErr){
    if (DEMO) return memSub(() => cb(Object.entries(mem.checks).map(([id,d]) => ({id, ...d})).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))));
    return db.collection("checks").where("ownerUid","==",uid).onSnapshot(
      s => cb(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))),
      onErr);
  },
  watchCheck(id, cb, onErr){
    if (DEMO) return memSub(() => cb(mem.checks[id] || null, mem.answers[id] || {}));
    let check, answers = {}, gotC = false, gotA = false;
    const fire = () => { if (gotC && gotA) cb(check, answers); };
    const u1 = db.doc("checks/" + id).onSnapshot(s => { check = s.exists ? s.data() : null; gotC = true; fire(); }, onErr);
    const u2 = db.collection("checks/" + id + "/answers").onSnapshot(s => {
      answers = {}; s.docs.forEach(d => answers[d.id] = d.data()); gotA = true; fire();
    }, onErr);
    return () => { u1(); u2(); };
  },
  async saveAnswer(id, role, d){
    const body = {...d, by: uid || "demo", at: new Date().toISOString()};
    if (DEMO){ (mem.answers[id] ||= {})[role] = body; memEmit(); return; }
    await db.doc("checks/" + id + "/answers/" + role).set(body);
  },
  watchLogs(cb, onErr){
    if (DEMO) return memSub(() => cb(Object.entries(mem.logs).map(([id,d]) => ({id,...d})).sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt))));
    return db.collection("data/users/" + uid).onSnapshot(
      s => cb(s.docs.map(d => ({id:d.id, ...d.data()})).filter(d => d.type === "log")
             .sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)))),
      onErr);
  },
  async addLog(d){
    const body = {...d, type:"log", createdAt:new Date().toISOString()};
    if (DEMO){ mem.logs[newId()] = body; memEmit(); return; }
    await db.collection("data/users/" + uid).doc("log-" + newId()).set(body);
  },
  async deleteLog(id){
    if (DEMO){ delete mem.logs[id]; memEmit(); return; }
    await db.collection("data/users/" + uid).doc(id).delete();
  }
};

/* ---------- ルーティング ---------- */
let unsub = null;
const stop = () => { if (unsub){ unsub(); unsub = null; } };
function route(){
  stop();
  const h = location.hash.replace(/^#/, "");
  $("#tabGap").setAttribute("aria-current", h === "log" ? "false" : "page");
  $("#tabLog").setAttribute("aria-current", h === "log" ? "page" : "false");
  if (h === "log") return viewLog();
  if (h.startsWith("check-")) return viewCheck(h.slice(6));
  return viewHome();
}
function loadingGuard(onTimeout){
  const t = setTimeout(onTimeout, 10000);
  return () => clearTimeout(t);
}
const errBox = msg => `<div class="err">${esc(msg)}</div>`;

/* ---------- ホーム：すり合わせ一覧と作成 ---------- */
function viewHome(){
  app.innerHTML = `
  <section class="hero">
    <div>
      <h1>そのプレッシャー、<br>本当に求められていますか。</h1>
      <p class="lead">同じ6つの問いに、あなたと上司（または同僚）がそれぞれ答えます。ふたりの答えを並べると、思い込みと本当の期待の差が見えてきます。</p>
    </div>
    <div class="pair" aria-hidden="true">
      <div class="sticky a">研究成果、もっと出さないと…</div>
      <div class="sticky b">まずは授業を立て直してほしい</div>
    </div>
  </section>

  <section class="panel">
    <h2>新しいすり合わせを始める</h2>
    <label class="f" for="t">タイトル</label>
    <input type="text" id="t" maxlength="60" placeholder="例：2026年度 後期の目標について">
    <label class="f">答えてもらう相手</label>
    <div class="chips" id="partner">
      ${["上司","同僚","部局の事務","メンター"].map((p,i)=>`<button class="chip" type="button" aria-pressed="${i===0}" data-v="${p}">${p}</button>`).join("")}
    </div>
    <div class="row" style="margin-top:18px"><button class="btn" id="create">作成して自分の回答へ進む</button></div>
    <div id="cErr"></div>
  </section>

  <section class="panel">
    <h2>あなたのすり合わせ</h2>
    <div id="mine"><p class="muted small">読み込んでいます…</p></div>
  </section>`;

  let partner = "上司";
  $("#partner").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    partner = b.dataset.v;
    $("#partner").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  });
  $("#create").onclick = async () => {
    const title = $("#t").value.trim() || "期待のすり合わせ";
    $("#create").disabled = true;
    try { const id = await store.createCheck({title, partnerLabel: partner}); location.hash = "check-" + id; }
    catch(e){ $("#cErr").innerHTML = errBox("作成できませんでした。このページへの書き込み権限（投稿者以上）があるか確認してください。"); $("#create").disabled = false; }
  };

  const clear = loadingGuard(() => { const m = $("#mine"); if (m && m.textContent.includes("読み込んで")) m.innerHTML = `<p class="muted small">データにまだ接続できません。少し待ってから開き直してください。</p>`; });
  unsub = store.watchMyChecks(list => {
    clear();
    const m = $("#mine"); if (!m) return;
    if (!list.length){ m.innerHTML = `<div class="empty">まだありません。上のフォームから最初のすり合わせを作ってみましょう。</div>`; return; }
    m.innerHTML = `<ul class="list">${list.map(c => `
      <li><span><a href="#check-${esc(c.id)}">${esc(c.title)}</a><br><span class="small muted">相手：${esc(c.partnerLabel)}・${esc(String(c.createdAt).slice(0,10))}</span></span></li>`).join("")}</ul>`;
  }, () => { clear(); const m = $("#mine"); if (m) m.innerHTML = `<p class="muted small">一覧を読み込めませんでした。</p>`; });
}

/* ---------- すり合わせ詳細 ---------- */
let demoRole = "self";
function viewCheck(id){
  app.innerHTML = `<p class="muted">読み込んでいます…</p>`;
  const clear = loadingGuard(() => { if (app.textContent.includes("読み込んで")) app.innerHTML = `<p class="muted">データにまだ接続できません。少し待ってから開き直してください。</p>`; });
  let draft = null, lastKey = "";
  unsub = store.watchCheck(id, (check, answers) => {
    clear();
    if (!check){ app.innerHTML = `<div class="empty">このすり合わせは見つかりませんでした。<br><a href="#">一覧へ戻る</a></div>`; return; }
    const role = DEMO ? demoRole : (check.ownerUid === uid ? "self" : "partner");
    const key = JSON.stringify([role, !!answers.self, !!answers.partner, answers.self?.at, answers.partner?.at]);
    if (key === lastKey) return; lastKey = key;
    renderCheck(id, check, answers, role, d => draft = d, () => draft);
  }, () => { clear(); app.innerHTML = `<div class="empty">読み込めませんでした。リンクと共有設定を確認してください。</div>`; });
}

function renderCheck(id, check, answers, role, setDraft, getDraft){
  const mine = answers[role], both = answers.self && answers.partner;
  const partnerLabel = check.partnerLabel || "相手";
  const meName = role === "self" ? "あなた" : "本人";
  const demoSwitch = DEMO ? `
    <div class="row small" style="margin:6px 0 4px"><span class="muted">お試し：誰として答えますか</span>
      <button class="chip" data-role="self" aria-pressed="${role==="self"}">本人</button>
      <button class="chip" data-role="partner" aria-pressed="${role==="partner"}">${esc(partnerLabel)}</button></div>` : "";

  const status = `<div class="status">
      <span class="badge ${answers.self?"done":"wait"}">本人：${answers.self?"回答済み":"未回答"}</span>
      <span class="badge ${answers.partner?"done":"wait"}">${esc(partnerLabel)}：${answers.partner?"回答済み":"未回答"}</span></div>`;

  let body = "";
  if (both) body = resultsHTML(answers, partnerLabel, role);
  else if (mine) body = `<section class="panel">
      <h2>回答を受け付けました</h2>
      <p>${role==="self" ? `${esc(partnerLabel)}の回答がそろうと、ここにふたりの答えが並びます。` : "本人の回答がそろうと、ここにふたりの答えが並びます。"}</p>
      ${role==="self" && !DEMO ? `<p class="note">相手への頼み方：このページの共有メニューで相手を「投稿者（Contributor）」以上で招待し、このすり合わせを開いた状態で「リンクをコピー」して送ってください。回答はそれぞれの画面で入力します。</p>` : ""}
      <button class="btn sub small" id="redo">自分の回答を直す</button></section>`;
  else body = formHTML(role, partnerLabel);

  app.innerHTML = `<p class="small"><a href="#" style="color:var(--muted)">すり合わせ一覧</a></p>
    <h1 style="font-size:clamp(22px,4vw,30px)">${esc(check.title)}</h1>
    <p class="muted">${role==="self" ? `あなたと${esc(partnerLabel)}の期待のすり合わせ` : `本人から、期待のすり合わせを頼まれています。あなたが本人に期待していることを、率直に答えてください。`}</p>
    ${demoSwitch}${status}${body}`;

  app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { demoRole = b.dataset.role; stop(); viewCheck(id); });
  if ($("#redo")) $("#redo").onclick = () => { app.querySelector(".panel").outerHTML = formHTML(role, partnerLabel, mine); bindForm(id, role, mine); };
  if (!both && !mine) bindForm(id, role);
  if (both) bindResults(answers, partnerLabel, check.title);
}

function formHTML(role, partnerLabel, prev){
  const v = prev?.scores || {};
  return `<section class="panel ${role==="self"?"role-me":"role-them"}" id="form">
    <h2>${role==="self" ? `${esc(partnerLabel)}から何を求められていると思いますか` : "本人に何を求めていますか"}</h2>
    <p class="muted small">深く考えず、いまの感覚で1〜5を選んでください。</p>
    ${QS.map(q => `<div class="q" data-q="${q.id}">
      <h3>${esc(q.label)}</h3><div class="small muted">${esc(askText(q, role))}</div>
      <div class="scale" role="group" aria-label="${esc(q.label)}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-pressed="${v[q.id]===n}">${n}</button>`).join("")}</div>
      <div class="ends"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div></div>`).join("")}
    <div class="q"><label class="f" for="free" style="margin-top:0">${role==="self" ? "今期いちばん大切にしたいこと" : "今期いちばん大切にしてほしいこと"}</label>
      <textarea id="free" maxlength="400" placeholder="ひとことで構いません">${esc(prev?.free || "")}</textarea></div>
    <div class="row"><button class="btn" id="submit" disabled>回答を送る</button><span class="small muted" id="left"></span></div>
    <div id="fErr"></div></section>`;
}
function bindForm(id, role, prev){
  const scores = {...(prev?.scores || {})};
  const f = $("#form");
  const upd = () => { const n = QS.filter(q => !scores[q.id]).length; $("#submit").disabled = n > 0; $("#left").textContent = n ? `あと${n}問` : ""; };
  f.addEventListener("click", e => {
    const b = e.target.closest(".scale button"); if (!b) return;
    const qid = b.closest("[data-q]").dataset.q; scores[qid] = +b.dataset.n;
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    upd();
  });
  upd();
  $("#submit").onclick = async () => {
    $("#submit").disabled = true;
    try { await store.saveAnswer(id, role, {scores, free: $("#free").value.trim()}); }
    catch(e){ $("#fErr").innerHTML = errBox("送信できませんでした。このページへの書き込み権限（投稿者以上）があるか確認してください。"); $("#submit").disabled = false; }
  };
}

function verdict(d){ return d >= 2 ? ["big","ズレあり"] : d === 1 ? ["near","ほぼ近い"] : ["same","一致"]; }
function resultsHTML(a, partnerLabel){
  const s = a.self.scores, p = a.partner.scores;
  const gaps = QS.map(q => ({q, d: Math.abs(s[q.id]-p[q.id])})).sort((x,y)=>y.d-x.d);
  const big = gaps.filter(g => g.d >= 2);
  const pos = n => ((n-1)/4*100) + "%";
  return `<section class="panel">
    <h2>${big.length ? `${big.length}つの項目で、期待にズレがあります` : "大きなズレはありませんでした"}</h2>
    <p class="muted small">${big.length ? "ズレは悪いことではありません。話し合うきっかけが見つかった、ということです。" : "思っていたより、ふたりの期待は近いようです。安心材料として、面談で確認してみましょう。"}</p>
    <div class="row" style="gap:18px;margin:6px 0 4px"><span class="who me"><i></i>本人の受け止め</span><span class="who them"><i></i>${esc(partnerLabel)}の期待</span></div>
    ${QS.map(q => { const d = Math.abs(s[q.id]-p[q.id]); const [cls,txt] = verdict(d); const lo = Math.min(s[q.id],p[q.id]), hi = Math.max(s[q.id],p[q.id]);
      return `<div class="track-wrap"><div class="track-head"><h3>${esc(q.label)}</h3><span class="verdict ${cls}">${txt}</span></div>
      <div class="track" role="img" aria-label="${esc(q.label)}：本人${s[q.id]}、${esc(partnerLabel)}${p[q.id]}">
        <div class="rail"></div>${[1,2,3,4,5].map(n=>`<div class="tick" style="left:${pos(n)}"></div>`).join("")}
        ${d ? `<div class="band" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>` : ""}
        <div class="mk me" style="left:${pos(s[q.id])}">本</div><div class="mk them" style="left:${pos(p[q.id])}">相</div>
      </div><div class="ends" style="margin:0 2px"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div></div>`; }).join("")}
  </section>
  <section class="panel"><h2>大切にしたいこと</h2>
    <div class="quotes"><div class="quote me"><b>本人</b>${esc(a.self.free) || "（記入なし）"}</div>
    <div class="quote them"><b>${esc(partnerLabel)}</b>${esc(a.partner.free) || "（記入なし）"}</div></div></section>
  <section class="panel" id="aiPanel"><h2>面談で話すことを考える</h2>
    <p class="muted small">ふたりの回答をもとに、次の面談や1on1で使える問いかけをAIが提案します。</p>
    <button class="btn" id="aiBtn">話すきっかけを提案してもらう</button>
    <div id="aiOut" class="ai"></div></section>`;
}
function bindResults(a, partnerLabel, title){
  const btn = $("#aiBtn"), out = $("#aiOut");
  if (!sample){ btn.disabled = true; out.innerHTML = `<p class="small muted">この画面ではAIの提案を使えません。</p>`; return; }
  btn.onclick = async () => {
    btn.disabled = true; out.innerHTML = `<p class="small muted">考えています…（30秒ほどかかることがあります）</p>`;
    const rows = QS.map(q => `- ${q.label}（1=${q.lo}、5=${q.hi}）：本人の受け止め ${a.self.scores[q.id]} / ${partnerLabel}の期待 ${a.partner.scores[q.id]}`).join("\n");
    const prompt = `あなたは大学教職員のキャリア支援に詳しいコーチです。本人と${partnerLabel}が「期待のすり合わせ」シートにそれぞれ回答しました。本人は成果へのプレッシャーを感じています。
タイトル：${title}
${rows}
本人が今期大切にしたいこと：${a.self.free || "記入なし"}
${partnerLabel}が本人に大切にしてほしいこと：${a.partner.free || "記入なし"}

ズレの大きい項目を優先し、次の面談で本人から${partnerLabel}に投げかけられる問いを3つ提案してください。責める言い方や評価的な言い方は避け、やわらかく具体的な日本語にしてください。
次のJSONだけを返してください：{"insight":"全体の見立てを2文以内で","topics":[{"theme":"項目名","why":"なぜ話す価値があるか1文","question":"本人が実際に口にする問いかけ"}]}`;
    try {
      const r = await sample.json(prompt);
      out.innerHTML = `<p style="margin-top:14px">${esc(r.insight)}</p><ol>${(r.topics||[]).map(t => `<li><b>${esc(t.theme)}</b><br><span class="small muted">${esc(t.why)}</span><br>「${esc(String(t.question).replace(/^「|」$/g,""))}」</li>`).join("")}</ol>`;
      btn.textContent = "別の提案をもらう";
    } catch(e){
      out.innerHTML = e?.code === "not_granted" ? `<p class="small muted">AIの利用が許可されていません。</p>` :
        e?.code === "rate_limited" ? errBox("混み合っています。少し時間をおいてから試してください。") : errBox("提案を作れませんでした。もう一度試してください。");
    }
    btn.disabled = false;
  };
}

/* ---------- 成果ログ ---------- */
function viewLog(){
  if (!DEMO && !uid){ app.innerHTML = `<div class="empty">成果ログを使うにはサインインが必要です。</div>`; return; }
  const today = new Date().toISOString().slice(0,10);
  app.innerHTML = `
  <h1>見えにくい仕事を、<br>成果のことばに。</h1>
  <p class="lead">学生の相談にのった、資料を直した、会議を回した。数字にならない仕事をひとことずつ残しておくと、評価面談の前にAIが評価シート向けの文章にまとめます。ログはあなただけが見られます。</p>
  <section class="panel">
    <label class="f" for="lt" style="margin-top:0">今日やったこと</label>
    <textarea id="lt" maxlength="300" placeholder="例：卒論で迷っていた学生2人と面談し、テーマを絞り込めた"></textarea>
    <label class="f">種類</label>
    <div class="chips" id="lk">${KINDS.map((k,i)=>`<button type="button" class="chip" aria-pressed="${i===0}" data-v="${k}">${k}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><input type="date" id="ld" value="${today}" style="width:auto;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
      <button class="btn" id="ladd">記録する</button></div>
    <div id="lErr"></div>
  </section>
  <section class="panel">
    <h2>評価シート用にまとめる</h2>
    <p class="muted small">期間を選ぶと、記録をもとに成果の要約・項目・次の目標の下書きを作ります。</p>
    <div class="row"><select id="per" style="width:auto"><option value="30">直近1か月</option><option value="90" selected>直近3か月</option><option value="182">直近半年</option><option value="365">直近1年</option></select>
      <button class="btn" id="sum">下書きを作る</button></div>
    <div id="sumOut"></div>
  </section>
  <section class="panel logs"><h2>記録</h2><div id="ll"><p class="muted small">読み込んでいます…</p></div></section>`;

  let kind = KINDS[0], logs = [];
  $("#lk").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; kind = b.dataset.v; $("#lk").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c===b)); });
  $("#ladd").onclick = async () => {
    const text = $("#lt").value.trim(); if (!text){ $("#lt").focus(); return; }
    $("#ladd").disabled = true; $("#lErr").innerHTML = "";
    try { await store.addLog({text, kind, date: $("#ld").value || today}); $("#lt").value = ""; }
    catch(e){ $("#lErr").innerHTML = errBox("記録できませんでした。もう一度試してください。"); }
    $("#ladd").disabled = false;
  };

  const clear = loadingGuard(() => { const l = $("#ll"); if (l && l.textContent.includes("読み込んで")) l.innerHTML = `<p class="muted small">データにまだ接続できません。</p>`; });
  unsub = store.watchLogs(list => {
    clear(); logs = list; const l = $("#ll"); if (!l) return;
    if (!list.length){ l.innerHTML = `<div class="empty">まだ記録がありません。小さなことでも、ひとつ書いてみましょう。</div>`; return; }
    const byMonth = {}; list.forEach(x => (byMonth[String(x.date).slice(0,7)] ||= []).push(x));
    l.innerHTML = Object.entries(byMonth).map(([m, xs]) => `<h3>${m.replace("-","年")}月・${xs.length}件</h3>` + xs.map(x => `
      <div class="log-item"><span class="kind">${esc(x.kind)}</span><div>${esc(x.text)}<div class="small muted">${esc(x.date)}</div></div>
      <button class="del" data-del="${esc(x.id)}" aria-label="この記録を削除">削除</button></div>`).join("")).join("");
  }, () => { clear(); const l = $("#ll"); if (l) l.innerHTML = `<p class="muted small">記録を読み込めませんでした。</p>`; });

  $("#ll").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (!confirm("この記録を削除しますか？")) return;
    try { await store.deleteLog(b.dataset.del); } catch(_){}
  });

  const sumBtn = $("#sum"), out = $("#sumOut");
  if (!sample){ sumBtn.disabled = true; out.innerHTML = `<p class="small muted">この画面ではAIのまとめを使えません。</p>`; return; }
  sumBtn.onclick = async () => {
    const days = +$("#per").value, from = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
    const pick = logs.filter(x => x.date >= from);
    if (pick.length < 2){ out.innerHTML = errBox("この期間の記録が少なすぎます。2件以上記録してから試してください。"); return; }
    sumBtn.disabled = true; out.innerHTML = `<p class="small muted">まとめています…（30秒ほどかかることがあります）</p>`;
    const prompt = `あなたは大学の人事評価に詳しいキャリアコンサルタントです。以下は大学教職員が日々つけた業務ログです（${from}以降、${pick.length}件）。数字になりにくい教育・支援・運営の仕事を、評価者に伝わる「成果」のことばに言い換えてください。誇張や事実にない数字の創作はしないでください。

${pick.map(x => `- ${x.date}［${x.kind}］${x.text}`).join("\n")}

次のJSONだけを返してください：{"summary":"期間全体の成果を3文以内で","items":[{"title":"成果項目の見出し","detail":"評価シートに書ける1〜2文","basis":"根拠になった記録の要約"}],"nextGoals":["次の期間の目標案（具体的に）"],"strength":"記録から見える本人の強み1文"}
itemsは3〜5件、nextGoalsは2〜3件。`;
    try {
      const r = await sample.json(prompt);
      const text = `【成果の要約】\n${r.summary}\n\n【成果項目】\n${(r.items||[]).map(i=>`・${i.title}：${i.detail}`).join("\n")}\n\n【次の目標】\n${(r.nextGoals||[]).map(g=>`・${g}`).join("\n")}`;
      out.innerHTML = `<div class="sheet">
        <h3>成果の要約</h3><p>${esc(r.summary)}</p>
        <h3 style="margin-top:14px">成果項目</h3>
        <div class="scroll"><table><thead><tr><th>見出し</th><th>評価シート向けの文</th><th>もとになった記録</th></tr></thead>
        <tbody>${(r.items||[]).map(i=>`<tr><td><b>${esc(i.title)}</b></td><td>${esc(i.detail)}</td><td class="small muted">${esc(i.basis)}</td></tr>`).join("")}</tbody></table></div>
        <h3 style="margin-top:14px">次の目標案</h3><ul>${(r.nextGoals||[]).map(g=>`<li>${esc(g)}</li>`).join("")}</ul>
        <p class="note">あなたの強み：${esc(r.strength)}</p>
        <div class="row"><button class="btn sub small" id="copy">文章をコピー</button><span class="small muted" id="copied"></span></div></div>`;
      $("#copy").onclick = async () => {
        try { await navigator.clipboard.writeText(text); $("#copied").textContent = "コピーしました"; }
        catch(_){ $("#copied").textContent = "コピーできませんでした。表から選択してコピーしてください。"; }
      };
    } catch(e){
      out.innerHTML = e?.code === "not_granted" ? `<p class="small muted">AIの利用が許可されていません。</p>` :
        e?.code === "rate_limited" ? errBox("混み合っています。少し時間をおいてから試してください。") : errBox("まとめを作れませんでした。もう一度試してください。");
    }
    sumBtn.disabled = false;
  };
}

/* ---------- 起動 ---------- */
async function init(){
  const has = typeof window.claude?.use === "function";
  if (has){
    [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
    if (user) uid = await user.id().catch(() => null);
  }
  if (!db || !uid){ DEMO = true; db = null; $("#demoBar").hidden = false; }
  window.addEventListener("hashchange", route);
  route();
}
init().catch(() => { DEMO = true; $("#demoBar").hidden = false; route(); });
})();
</script>
</body>
</html>
